# NOT APPLIED. Documentation snippet for the nginx server blocks of roxira.ir AND ghazihoushmand.ir
# (the tracker posts to /umami on whichever host serves the page). Paste the block INSIDE each
# `server { ... }` block that serves the public site, then `nginx -t` and reload. Owner approval needed
# before applying on the server (docs/ops/OBSERVABILITY.md, section "Apply the nginx location").
#
# No URI part in proxy_pass on purpose: /umami/... reaches Umami unchanged, because Umami runs with
# BASE_PATH=/umami (docker-compose.analytics.yml). Do not add a trailing slash to proxy_pass.
location /umami/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
