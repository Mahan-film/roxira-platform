name: roxira-sandbox-smart-accounting
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: roxira-sandbox-smart-accounting:latest
    container_name: roxira_sandbox_smart-accounting
    restart: unless-stopped
    ports:
      - "4001:3000"
    environment:
      APP_ID: "smart-accounting"
      BUILD_PROMPT: "\u0633\u06cc\u0633\u062a\u0645 \u062c\u0627\u0645\u0639 \u062d\u0633\u0627\u0628\u062f\u0627\u0631\u06cc \u0627\u0628\u0631\u06cc \u062f\u0648\u0637\u0631\u0641\u0647\u060c \u0645\u062f\u06cc\u0631\u06cc\u062a \u062f\u0641\u062a\u0631 \u06a9\u0644\u060c \u062b\u0628\u062a \u0641\u0627\u06a9\u062a\u0648\u0631 \u0631\u0633\u0645\u06cc \u0648 \u062a\u0631\u0627\u0632 \u0622\u0632\u0645\u0627\u06cc\u0634\u06cc"
      TARGET_FRAMEWORK: "NextJS"
      ROXIRA_TEMPLATE: "nextjs-tailwind-landing"
    labels:
      roxira.sandbox: "true"
      roxira.app_id: "smart-accounting"
      roxira.template: "nextjs-tailwind-landing"
      roxira.host_port: "4001"
    networks:
      - roxira_net
networks:
  roxira_net:
    external: true
