# Local test stack for all lanes (#1319).
# Starts Postgres 17, Valkey 8, and Qdrant pinned by digest on unreserved ports (AGENTS.md sec 7).
# Pulls from public.ecr.aws where Docker Hub is blocked on Linux CI box.
# Memory capped strictly (total stack < 450 MB).
# Run via: bash scripts/dev/test_stack.sh up|down|status

services:
  postgres_test:
    image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: roxira_test_postgres
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ROXIRA_TEST_PG_PASSWORD}
      POSTGRES_DB: roxira_test
    ports:
      - "127.0.0.1:${ROXIRA_TEST_PG_PORT:-54380}:5432"
    volumes:
      - roxira_test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roxira_test"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s

  valkey_test:
    image: public.ecr.aws/valkey/valkey:8-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    container_name: roxira_test_valkey
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    ports:
      - "127.0.0.1:${ROXIRA_TEST_VALKEY_PORT:-6385}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  qdrant_test:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: roxira_test_qdrant
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "127.0.0.1:${ROXIRA_TEST_QDRANT_PORT:-6338}:6333"
      - "127.0.0.1:${ROXIRA_TEST_QDRANT_GRPC_PORT:-6339}:6334"
    volumes:
      - roxira_test_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s

volumes:
  roxira_test_pg_data:
  roxira_test_qdrant_data:
