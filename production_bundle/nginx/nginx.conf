events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    server {

    # SmartJudge Continuous Live Voice WebSocket (Cloudflare Full-Strict Compatible)
    location ~ ^/api/v1/apps/judge/(live-voice|ws) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

        listen 80;
        server_name ghazihoushmand.ir www.ghazihoushmand.ir roxira.net www.roxira.net roxira.ir www.roxira.ir localhost 127.0.0.1;

        # Enamad seals need a referrer carrying the origin; this policy still sends
        # the origin for cross-origin HTTPS requests (e.g. https://trustseal.enamad.ir)
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        # Static assets: cache for 1 day; proxies to the Python /static mount
        location /static/ {
            proxy_pass http://enterprise_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            proxy_pass http://enterprise_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
