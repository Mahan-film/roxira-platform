services:
  twenty_db:
    image: postgres:16.9-alpine
    container_name: roxira_twenty_db
    restart: always
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD:?set TWENTY_DB_PASSWORD in .env}
      POSTGRES_DB: default
    volumes:
      - /opt/roxira_platform/twenty_data/db:/var/lib/postgresql/data
    networks:
      - roxira_mesh

  twenty_redis:
    image: redis:7.4.11-alpine
    container_name: roxira_twenty_redis
    restart: always
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes
    volumes:
      - /opt/roxira_platform/twenty_data/redis:/data
    networks:
      - roxira_mesh

  twenty_crm:
    image: twentycrm/twenty:v2.41.0
    container_name: roxira_twenty_crm
    restart: always
    depends_on:
      - twenty_db
      - twenty_redis
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=3002
      - PG_DATABASE_URL=postgres://twenty:${TWENTY_DB_PASSWORD:?set TWENTY_DB_PASSWORD in .env}@twenty_db:5432/default
      - REDIS_URL=redis://twenty_redis:6379
      - SERVER_URL=https://roxira.ir/crm-service
      - ENCRYPTION_KEY=${TWENTY_ENCRYPTION_KEY:?set TWENTY_ENCRYPTION_KEY in .env}
      - APP_SECRET=${TWENTY_APP_SECRET:?set TWENTY_APP_SECRET in .env}
      - SIGN_IN_PREFILLED=false
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - /opt/roxira_platform/twenty_data/server:/app/packages/twenty-server/storage
    networks:
      - roxira_mesh

networks:
  roxira_mesh:
    external: true
