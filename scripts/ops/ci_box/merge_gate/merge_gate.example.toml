# Copy to ~/.config/roxira-merge-gate/merge_gate.toml (install_user.sh does this) and edit.
# Never put a token here: gh uses its own login (account mahansudo).
repo = "Mahan-film/roxira-platform"
base = "main"
label = "merge-queue"

# Stay true until the repo flip. While true, nothing is merged or commented (the main-push alert keeps a separate
# dry-run pointer file and sends nothing).
dry_run = true

# Also treat "auto-merge requested" as a request to merge (transition period).
allow_auto_merge_flag = true

# Local HTTP proxy for gh (empty = none).
proxy = "http://127.0.0.1:3128"

# State dir holds state.json, the flock file `lock` and the kill switch file `KILL`.
# `touch <state_dir>/KILL` stops the gate; remove it to resume.
state_dir = "~/.local/state/roxira-merge-gate"

# Check-run names (job `name:` in .github/workflows/ci.yml) that must be success/skipped/neutral
# on the exact head SHA. Verify with: gh api repos/<repo>/commits/<sha>/check-runs --jq '.check_runs[].name'
required_checks = [
  "Detect changes",
  "Secret scan (new commits only)",
  "Semgrep CE (new findings)",
  "Agent guards (money, tenant scope, model ids, secrets)",
  "Pytest (unit)",
  "Compose config",
  "Frontend lint + build",
  "Backend (tsc + jest + Postgres specs)",
  "Frontend gate",
]

# Decision B7: a PR touching any of these is class "owner sentence required". The gate never merges it; it
# comments once per head and waits for an owner comment line `OWNER-OK #<PR number> <head sha7>` written by an id
# in owner_approver_ids. This list REPLACES the code default, so keep the live toml in sync with this example.
protected_globs = [
  # migrations
  "migrations/**",
  "**/migrations/**",
  # payment, billing, auth
  "**/payment/**",
  "**/payments/**",
  "**/*payment*",
  "**/zibal*",
  "**/billing/**",
  "**/auth/**",
  "**/*auth/**",
  "**/auth_*/**",
  "**/auth.*",
  # production image, compose, deploy scripts and units (main autodeploys)
  "Dockerfile.prod",
  "**/Dockerfile.prod",
  "docker-compose.prod.yml",
  "scripts/ops/deploy*.sh",
  "scripts/ops/*deploy*.sh",
  "scripts/ops/autodeploy/**",
  "deploy/**",
  # workflows and the gate itself
  ".github/workflows/**",
  "scripts/ops/ci_box/merge_gate/**",
  "scripts/ci/merge_gate*.py",
  "src/ops/test_*merge_gate*.py",
  "docs/ops/MERGE_GATE_SPEC.md",
]

# Only comments by these logins count as review-desk verdicts.
review_comment_authors = ["github-actions[bot]"]   # used only while the id list below is empty
# Numeric ids of the review-desk accounts (gh api users/<login> --jq .id). When set they replace the login check.
review_comment_author_ids = []

# Explicit holds: a PR with one of these labels, or a title containing one of these markers, is never merged.
block_labels = ["needs-human", "do-not-merge"]
block_title_markers = ["[needs owner]"]

# Decision B7-2: false = merge a green head even when behind, as long as it merges cleanly into the current main
# (what the old ruleset did). The gate then merges one PR per tick and waits for that merge's push CI run on main;
# a red run pauses the gate (file PAUSE in state_dir) and alerts on Telegram.
# true = the PR must contain the tip of main (update-branch + new CI + new review per PR; starved the dry-run).
require_up_to_date = false
main_ci_workflow = "ci.yml"          # push-to-main run that must pass after each gate merge
main_ci_grace_seconds = 300          # no run after this = paths-ignored push, counted as passed

# Dispatch review-desk.yml for a PR that passed every other rule but has no verdict for its head (once per head,
# one per tick, only when no desk run is queued or running). Acts even while dry_run = true.
dispatch_review_desk = true
review_desk_workflow = "review-desk.yml"

# Numeric GitHub user ids (gh api users/<login> --jq .id). Empty = feature off.
approver_ids = []        # human APPROVE on the exact head counts as a review
# Human owners whose `OWNER-OK #<PR> <sha7>` comment releases a protected-path PR. Must be accounts that no agent,
# automation or box token can act as; empty = no protected PR is ever merged by the gate (fails closed).
owner_approver_ids = []
