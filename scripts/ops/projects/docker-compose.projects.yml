# Shared infrastructure for multi-project hosting (F5). Start with:
#   docker compose -f docker-compose.projects.yml --env-file /srv/projects/.infra.env up -d
# .infra.env (mode 600, NOT in git) must define PROJECTS_PG_PASSWORD; optional:
#   PROJECTS_HTTP_PORT (80) PROJECTS_HTTPS_PORT (443) PROJECTS_BIND (0.0.0.0) PROJECTS_PROXY_DIR
# On the Roxira server ports 80/443 belong to nginx: do NOT start projects_caddy there
# (the proxy is behind the "proxy" profile) -- see docs/ops/PROJECTS.md.
name: projects_infra

services:
  projects_postgres:
    image: postgres:17
    container_name: projects_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PROJECTS_PG_PASSWORD:?set PROJECTS_PG_PASSWORD in the infra env file}
    volumes:
      - projects_pgdata:/var/lib/postgresql/data
    networks: [projects_net]      # no published port: only containers on projects_net reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  projects_caddy:
    image: caddy:2
    container_name: projects_caddy
    restart: unless-stopped
    profiles: ["proxy"]           # opt-in: docker compose --profile proxy up -d projects_caddy
    ports:
      - "${PROJECTS_BIND:-0.0.0.0}:${PROJECTS_HTTP_PORT:-80}:${PROJECTS_HTTP_PORT:-80}"
      - "${PROJECTS_BIND:-0.0.0.0}:${PROJECTS_HTTPS_PORT:-443}:${PROJECTS_HTTPS_PORT:-443}"
    volumes:
      - ${PROJECTS_PROXY_DIR:-/srv/projects/_proxy}/Caddyfile:/etc/caddy/Caddyfile:ro
      - projects_caddy_data:/data
      - projects_caddy_config:/config
    networks: [projects_net]

networks:
  projects_net:
    name: projects_net

volumes:
  projects_pgdata:
  projects_caddy_data:
  projects_caddy_config:
