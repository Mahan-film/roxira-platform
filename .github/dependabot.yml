version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /output_apps/enterprise_hub/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      frontend-types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      frontend-minor-patch:
        exclude-patterns:
          - "@types/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /output_apps/enterprise_hub
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      enterprise-hub-types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      enterprise-hub-minor-patch:
        exclude-patterns:
          - "@types/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      e2e-types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      e2e-minor-patch:
        exclude-patterns:
          - "@types/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-root-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /output_apps/enterprise_hub
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      enterprise-hub-docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /output_apps/enterprise_hub/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend-docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /services/research
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      research-docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /templates/saas-chassis
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      saas-chassis-docker-minor-patch:
        update-types:
          - minor
          - patch
