name: Factory research

# W11 Project Factory, stage 2. Triggered when an owner brief gets the `brief`
# label (.github/ISSUE_TEMPLATE/project-brief.yml applies it automatically),
# or manually via workflow_dispatch. Runs src.automation.tech_radar in
# --project-brief mode (W9: multilingual sourcing, --report-lang fa,
# --max-usd budget guard), then posts the Persian proposal as an issue
# comment (factory_post_proposal.py) and uploads the full report as a
# workflow artifact. Runs only on GitHub Actions, never on the production
# server -- see docs/PROJECT_FACTORY.md and docs/STRATEGY.md section 8.
#
# Same guard shape as .github/workflows/agent-task.yml: a kill switch
# (FACTORY_ENABLED repo variable) and an actor allowlist, both checked in the
# job's `if:` before any checkout happens. The preflight step additionally
# reports missing secrets to the brief issue in Persian.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Brief issue number to research (must be labelled `brief`)"
        required: true
        type: string

concurrency:
  group: factory-research-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}

jobs:
  research:
    name: Research technology stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      vars.FACTORY_ENABLED == 'true' &&
      (
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'brief' &&
         contains(format(',{0},', vars.AGENT_ALLOWED_ACTORS || 'mahan-films'), format(',{0},', github.event.sender.login)))
        ||
        (github.event_name == 'workflow_dispatch' &&
         contains(format(',{0},', vars.AGENT_ALLOWED_ACTORS || 'mahan-films'), format(',{0},', github.actor)))
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Factory controls
        id: preflight
        env:
          SECRETS_PRESENT: >-
            ${{ secrets.OPENROUTER_RESEARCH_KEY != '' && 'OPENROUTER_RESEARCH_KEY' || '' }},${{ secrets.BRAVE_API_KEY != '' && 'BRAVE_API_KEY' || '' }},${{ secrets.EXA_API_KEY != '' && 'EXA_API_KEY' || '' }},${{ secrets.FIRECRAWL_API_KEY != '' && 'FIRECRAWL_API_KEY' || '' }},${{ secrets.JINA_API_KEY != '' && 'JINA_API_KEY' || '' }},${{ secrets.TAVILY_KEYS != '' && 'TAVILY_KEYS' || '' }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: python3 -m src.factory_pipeline.preflight | tee "$RUNNER_TEMP/preflight-report.txt"

      - name: Report missing Factory controls on the brief issue
        if: steps.preflight.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/preflight-report.txt"

      - name: Install research pipeline dependencies
        if: steps.preflight.outputs.ok == 'true'
        run: |
          set -euo pipefail
          # tech_radar.py's whole call chain (project_brief, llm_router_bridge,
          # llm_router, web_intelligence, source_adapters, translate,
          # budget_guard) is stdlib + httpx only -- no crawlee/playwright needed
          # for this path (verified by reading each module's imports).
          pip install "httpx>=0.28.1"

      - name: Fetch the brief issue title and compute its slug
        if: steps.preflight.outputs.ok == 'true'
        id: brief
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json title -q '.title' > "$RUNNER_TEMP/idea.txt"
          ISSUE_NUMBER="$ISSUE_NUMBER" python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from src.factory_pipeline.brief_subject import build_subject, pick_layers

          temp = Path(os.environ["RUNNER_TEMP"])
          title = (temp / "idea.txt").read_text()
          body = subprocess.check_output(
              ["gh", "issue", "view", os.environ["ISSUE_NUMBER"], "--json", "body", "-q", ".body"],
              text=True,
          )
          (temp / "subject.txt").write_text(build_subject(title.strip(), body))
          (temp / "layers.txt").write_text(",".join(pick_layers(body)))
          PY
          python3 - <<'PY'
          import os

          from src.factory_pipeline.slugs import slugify_project

          idea_path = os.path.join(os.environ["RUNNER_TEMP"], "idea.txt")
          idea = open(idea_path, encoding="utf-8").read().strip()
          slug = slugify_project(idea)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"slug={slug}\n")
          PY

      - name: Record research start in the run ledger
        if: steps.preflight.outputs.ok == 'true'
        run: |
          python3 -m src.factory_pipeline.run_ledger append \
            --file "$RUNNER_TEMP/ledger.jsonl" --run-id "${{ github.run_id }}" \
            --stage research --status started --issue "$ISSUE_NUMBER"

      - name: Run project-brief research
        if: steps.preflight.outputs.ok == 'true'
        id: project_brief_research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_RESEARCH_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TAVILY_KEYS: ${{ secrets.TAVILY_KEYS }}
          # Free models return empty completions for structured per-layer synthesis
          # (first live run, 2026-10-01); `cheap` costs ~5 cents per run. Override with
          # the repo variables RADAR_LAYER_TIER / RADAR_FINAL_TIER (free|cheap|strong).
          RADAR_LAYER_TIER: ${{ vars.RADAR_LAYER_TIER || 'cheap' }}
          RADAR_FINAL_TIER: ${{ vars.RADAR_FINAL_TIER || 'cheap' }}
        run: |
          set -o pipefail
          idea="$(cat "$RUNNER_TEMP/idea.txt")"
          python3 -m src.automation.tech_radar \
            --project-brief "$(cat "$RUNNER_TEMP/subject.txt")" \
            --layers "$(cat "$RUNNER_TEMP/layers.txt")" \
            --report-lang fa \
            --max-usd 0.50 \
            --brief-out "$RUNNER_TEMP/brief.md" \
            --json > "$RUNNER_TEMP/brief.result.json"

      - name: Record research result in the run ledger
        if: steps.preflight.outputs.ok == 'true' && always()
        run: |
          python3 -m src.factory_pipeline.run_ledger append \
            --file "$RUNNER_TEMP/ledger.jsonl" --run-id "${{ github.run_id }}" \
            --stage research \
            --status "${{ steps.project_brief_research.outcome == 'success' && 'success' || 'failure' }}" \
            --issue "$ISSUE_NUMBER"

      - name: Post the Persian proposal on the brief issue
        if: steps.preflight.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 output_apps/ecosystem_core/src/factory/factory_post_proposal.py \
            --issue "$ISSUE_NUMBER" --brief-json "$RUNNER_TEMP/brief.result.json"

      - name: Upload full research report as an artifact
        if: steps.preflight.outputs.ok == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-research-${{ env.ISSUE_NUMBER }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/brief.md
            ${{ runner.temp }}/brief.result.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload run ledger artifact
        if: steps.preflight.outputs.ok == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-ledger-${{ env.ISSUE_NUMBER }}
          path: ${{ runner.temp }}/ledger.jsonl
          retention-days: 30
          if-no-files-found: warn
