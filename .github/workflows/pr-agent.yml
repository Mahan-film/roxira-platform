name: PR Agent

# Free second AI reviewer using qodo-ai/pr-agent (MIT, Issue #1344).
# Runs through LiteLLM on the existing OpenRouter secret (config/models.yaml role free / cheap).
# Trigger: pull_request (never pull_request_target), skip fork PRs, one /review per head.
# Complements the review desk: never posts a Verdict line and never blocks merge.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-agent:
    name: PR Agent review (non-blocking)
    if: |
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check if already reviewed at this head
        id: check_head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          marker="<!-- pr-agent-review-head: $HEAD_SHA -->"
          found=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$found" ]; then
            echo "Already reviewed head $HEAD_SHA in comment $found; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No review found for head $HEAD_SHA; proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PR Agent
        if: steps.check_head.outputs.skip != 'true'
        uses: qodo-ai/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_AGENT_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_AGENT_KEY }}
          OPENAI_KEY: ${{ secrets.OPENROUTER_AGENT_KEY }}
          CONFIG.MODEL: "openrouter/qwen/qwen3.8-27b:free"
          CONFIG.FALLBACK_MODELS: '["openrouter/google/gemma-4-31b-it:free", "openrouter/nvidia/nemotron-3-super-120b-a12b:free", "openrouter/deepseek/deepseek-v4.1-flash"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "32000"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "synchronize", "ready_for_review"]'
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"
          PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER.REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          PR_REVIEWER.PERSISTENT_COMMENT: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Do NOT output any 'Verdict:' line or use the word Verdict. This review complements human and review-desk checks. Never block merge.\n<!-- pr-agent-review-head: ${{ steps.check_head.outputs.head_sha }} -->"
