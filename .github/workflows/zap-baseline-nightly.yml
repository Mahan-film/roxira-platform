name: Nightly OWASP ZAP baseline scan

# R29 / T288: Nightly passive dynamic application security scan (DAST) against staging.
# Runs OWASP ZAP baseline against the staging environment URL to detect
# runtime headers, cookie attributes, CSP, and passive web vulnerabilities.
# Never aimed at production; passive analysis only.
# Uploads HTML and Markdown reports as workflow artifacts.

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (defaults to staging)"
        required: false
        default: "https://staging.roxira.com"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP Baseline Scan (passive)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.target_url || vars.STAGING_URL || 'https://staging.roxira.com' }}
          cmd_options: "-a"
          allow_issue_writing: false

      - name: Upload ZAP scan report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2b6fb73d5b1e # v4.4.3
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
          retention-days: 14
