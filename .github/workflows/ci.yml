name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The server daemon pushes an audit commit to main every ~30 minutes that only
    # touches these generated reports. Skip CI for those pushes.
    paths-ignore:
      - "output_apps/enterprise_hub/frontend/public/autonomous_dashboard.json"
      - "output_apps/enterprise_hub/frontend/public/tech_radar_report.json"
      - "TECH_RADAR_*"
      - "**/*.md"
  # A PR opened with the default GITHUB_TOKEN (as agent-task.yml's agent PRs are)
  # does not trigger `pull_request` events — a deliberate GitHub anti-recursion
  # rule. agent-task.yml dispatches this workflow directly on the new branch via
  # `gh workflow run ci.yml --ref <branch>` so agent PRs still get a real CI run.
  workflow_dispatch:
    inputs:
      runner:
        # #949: fall back to GitHub-hosted runners when the box is offline (or force the box).
        description: "Runner: default (repo variable CI_RUNNER_MODE), auto, hosted or box"
        type: choice
        options: [default, auto, hosted, box]
        default: default
  # #949: nightly full run on main (every change filter on). It replaces the merge queue's
  # pre-merge run once the repo is private on GitHub Free, where merge queues do not exist.
  schedule:
    - cron: "40 21 * * *"
  # GitHub merge queue: the queue creates a temporary gh-readonly-queue/* branch and
  # requests checks on it. Required status checks must be reported for this event too.
  merge_group:
    types: [checks_requested]

concurrency:
  # Merge-queue groups each have their own head_ref, so they never cancel each other.
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "26"
  SEMGREP_VERSION: "1.178.0"
  TRIVY_VERSION: "0.75.0"

jobs:
  # #949 / #1024: choose GitHub-hosted or the box (roxira-ci) per slot. Logic and rules live in
  # scripts/ci/pick_runner.sh (tested in src/ops/test_pick_runner.py). Fork pull requests always
  # get hosted runners. continue-on-error plus the `|| '"ubuntu-latest"'` fallback in every
  # runs-on below mean a broken picker can never skip (and so silently pass) a required check.
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-slim
    timeout-minutes: 3
    continue-on-error: true
    outputs:
      light: ${{ steps.pick.outputs.light }}
      docker: ${{ steps.pick.outputs.docker }}
      image_registry: ${{ steps.pick.outputs.image_registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/ci/pick_runner.sh
          sparse-checkout-cone-mode: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          INPUT: ${{ inputs.runner }}
          MODE: ${{ vars.CI_RUNNER_MODE }}
          HEARTBEAT: ${{ vars.CI_BOX_HEARTBEAT }}
          BOX_LIGHT: ${{ vars.CI_BOX_LABELS_LIGHT }}
          BOX_DOCKER: ${{ vars.CI_BOX_LABELS_DOCKER }}
          HOSTED: ${{ vars.CI_HOSTED_RUNNER }}
          IMAGE_REGISTRY: ${{ vars.CI_IMAGE_REGISTRY }}
        run: |
          bash scripts/ci/pick_runner.sh | tee -a "$GITHUB_OUTPUT"
          grep '^where=' "$GITHUB_OUTPUT" | tail -1 | sed 's/^where=/Runner: /' >> "$GITHUB_STEP_SUMMARY"

  changes:
    name: Detect changes
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.python }}
      compose: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.compose }}
      frontend: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.backend }}
      projects: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.projects }}
      templates: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.templates }}
      e2e: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.e2e }}
      migrations: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        # The nightly run has no diff base; every filter is forced on in `outputs` above.
        if: github.event_name != 'schedule'
        with:
          # workflow_dispatch (used to run CI on agent-task.yml's PR branches, since a
          # PR opened with GITHUB_TOKEN doesn't trigger pull_request events) has no
          # natural "before" commit to diff against, unlike push/pull_request; give it
          # one explicitly. Left empty for push/pull_request so their own automatic
          # base detection (unaffected by this input) keeps working.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || (github.event_name == 'workflow_dispatch' && 'main' || '') }}
          # merge_group has no automatic base detection either: diff the queue's temporary
          # merge commit against the base it will land on. Other events keep the action's
          # own default (github.ref).
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.ref }}
          filters: |
            python:
              - "**/*.py"
              - "pyproject.toml"
              - "ci/requirements-test.txt"
              - ".github/workflows/ci.yml"
            compose:
              - "docker-compose.prod.yml"
              - "docker/research-stack/docker-compose.yml"
              - "ci/compose.env"
              - "scripts/ci/compose_policy.py"
              - ".github/workflows/ci.yml"
            frontend:
              - "output_apps/enterprise_hub/frontend/**"
              - ".github/workflows/ci.yml"
            backend:
              - "output_apps/enterprise_hub/**"
              - ".github/workflows/ci.yml"
            projects:
              - "projects/**"
              - ".github/workflows/ci.yml"
            templates:
              - "templates/**"
              - ".github/workflows/ci.yml"
            migrations:
              - "output_apps/enterprise_hub/migrations/**"
              - "scripts/dev/check_migration_ids.py"
              - "scripts/dev/lint_migrations_squawk.py"
              - "scripts/dev/install_squawk.sh"
              - ".github/workflows/ci.yml"
            e2e:
              - "e2e/**"
              - "output_apps/enterprise_hub/**"
              - "scripts/ci/mint_e2e_session.js"
              - ".github/workflows/ci.yml"

  gitleaks:
    name: Secret scan (new commits only)
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      # Blobless clone: full commit graph, blobs fetched lazily only for the scanned range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      # MIT gitleaks CLI binary (not gitleaks-action, which needs a licence for orgs).
      # Version + SHA-256 are pinned in scripts/dev/install_gitleaks.sh; the cache key hashes it.
      - name: Cache gitleaks binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/roxira/gitleaks-*
          key: gitleaks-${{ runner.os }}-${{ hashFiles('scripts/dev/install_gitleaks.sh') }}
      - name: Install gitleaks (pinned, SHA-256 verified)
        run: |
          dir="$(dirname "$(bash scripts/dev/install_gitleaks.sh)")"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/gitleaks" version
      - name: Self-test (a new fake token must be caught)
        run: |
          t=$(mktemp -d) && cp .gitleaks.toml "$t/" && cd "$t"
          git init -q && git -c user.email=ci@ci -c user.name=ci commit -q --allow-empty -m base
          echo "token = \"ghp_$(openssl rand -hex 18)\"" > leak.py
          git add leak.py && git -c user.email=ci@ci -c user.name=ci commit -q -m leak
          set +e
          gitleaks git --config .gitleaks.toml --log-opts="HEAD~1..HEAD" --no-banner --exit-code 42 .
          if [ $? -ne 42 ]; then
            echo "::error::gitleaks did not catch a fake token; check .gitleaks.toml"; exit 1
          fi
      - name: Scan commits introduced by this change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          # History already contains secrets on purpose (see docs/STRATEGY.md §6), so only
          # the commits this PR/push adds are scanned. Removing a secret never fails.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "Scanning $RANGE"
          gitleaks git --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner --verbose .

  trivy-fs:
    name: Trivy filesystem scan (report-only)
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache Trivy binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/roxira/trivy-*
          key: trivy-${{ runner.os }}-${{ hashFiles('scripts/dev/install_trivy.sh') }}
      - name: Install Trivy
        run: |
          TRIVY="$(bash scripts/dev/install_trivy.sh)"
          "$TRIVY" --version
          echo "TRIVY_BIN=$TRIVY" >> "$GITHUB_ENV"
      - name: Scan filesystem
        # mirror.gcr.io (Trivy's default DB source) is blocked from the CI box network; ghcr.io works everywhere.
        run: |
          "$TRIVY_BIN" fs --db-repository ghcr.io/aquasecurity/trivy-db:2 --java-db-repository ghcr.io/aquasecurity/trivy-java-db:1 \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format table . > "$RUNNER_TEMP/trivy-fs.txt"
      - name: Upload Trivy report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-fs-report
          path: ${{ runner.temp }}/trivy-fs.txt
          if-no-files-found: warn

  semgrep:
    # #949 T228: required check (replaces CodeQL once the repo is private). Custom rules fail the
    # PR only on findings the PR adds (--baseline-commit = merge base), so the 28 existing
    # findings never block. p/default on changed files stays report-only until triaged.
    name: Semgrep CE (new findings)
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Custom rules (blocking on new findings in a PR)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            echo "blocking on findings new since $base"
            semgrep scan --config .semgrep/roxira.yml --metrics=off --disable-version-check \
              --baseline-commit "$base" --error output_apps src scripts
          else
            echo "no diff base ($EVENT): full report, not blocking"
            semgrep scan --config .semgrep/roxira.yml --metrics=off --disable-version-check output_apps src scripts
          fi
      - name: Semgrep p/default on changed files (report-only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=d "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          echo "changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"
          [ -s "$RUNNER_TEMP/changed.txt" ] || exit 0
          xargs -a "$RUNNER_TEMP/changed.txt" semgrep scan --config p/default --metrics=off --quiet --disable-version-check \
            --exclude 'package-lock.json' --exclude 'node_modules' | tee "$RUNNER_TEMP/semgrep-default.txt"

  # R20-1: OSV-Scanner (Apache-2.0) over every tracked lockfile. REPORT-ONLY until the current
  # findings are triaged (see the follow-up issue); flip by removing continue-on-error.
  osv-scanner:
    name: OSV-Scanner (report-only)
    if: github.event_name == 'pull_request'
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache osv-scanner binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/roxira/osv-scanner-*
          key: osv-scanner-${{ runner.os }}-${{ hashFiles('scripts/dev/install_osv_scanner.sh') }}
      - name: Scan lockfiles
        run: |
          OSV="$(bash scripts/dev/install_osv_scanner.sh)"
          bash scripts/ci/osv_scan.sh "$OSV" | tee "$RUNNER_TEMP/osv.txt"
          { echo "### OSV-Scanner (report-only)"; tail -n 40 "$RUNNER_TEMP/osv.txt"; } >> "$GITHUB_STEP_SUMMARY"

  # T207: deterministic guards for the defects reviewers keep finding (docs/agents/LESSONS.md).
  # Blocking, but only on lines this PR adds (merge-base diff), so existing debt never blocks.
  agent-guards:
    name: Agent guards (money, tenant scope, model ids, secrets)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run guards on added lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/check_agent_guards.py --base "$BASE_SHA"
      - name: Check container image licences (no RSAL/SSPL/AGPL)
        run: python3 scripts/ci/check_image_licences.py

  runtime-licence-gate:
    name: Runtime licence gate (T252)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check runtime licences (no GPL/AGPL/SSPL/RSAL/CC-BY-NC/ELv2)
        run: python3 scripts/ci/check_runtime_licences.py

  ruff:
    name: Ruff (non-blocking)
    needs: [pick-runner, changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff>=0.16.2,<0.17"
      - name: ruff check
        id: ruff
        # Thousands of pre-existing violations: report, do not block. Flip to blocking once the count reaches 0.
        continue-on-error: true
        run: |
          set +e
          ruff check . --output-format=github
          code=$?
          count=$(ruff check . --output-format=concise --quiet | grep -c ':' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Ruff"
            echo "**$count** violations (non-blocking)."
            echo
            echo '```'
            ruff check . --statistics | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Report count on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ steps.ruff.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="<!-- ci-ruff-count -->
          **Ruff:** ${COUNT} violations (non-blocking). [Details]($RUN_URL)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- ci-ruff-count -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  undefined-names:
    name: Undefined names
    # Always runs (no change filter), like Frontend gate, so it can be a required
    # check on every PR. This is the F821/F822/F823 guard for issue #122: a deleted
    # function whose call sites remained must fail instead of shipping.
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff check (undefined names)
        # Blocking on purpose (no continue-on-error). The two --exclude files do not
        # parse today (pre-existing, issue #122) and must be fixed or deleted in a
        # follow-up before this check can drop its excludes.
        run: |
          python3 -m pip install ruff && ruff check --select F821,F822,F823 output_apps/generated_modules/smartjudge output_apps/ecosystem_core/src src --exclude output_apps/ecosystem_core/src/crawlers/roxira_factory_core.py --exclude src/legal_intelligence/inject_remaining_corpus.py

  system-inventory:
    name: System inventory up to date
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # If this fails, run `python3 scripts/gen_system_inventory.py` and commit docs/SYSTEM_INVENTORY.generated.md.
      - run: python3 -m pip install pyyaml && python3 scripts/gen_system_inventory.py --check
      # AGENTS.md section 3: model ids live in config/models.yaml only. Baseline: scripts/ci/hardcoded_model_ids_baseline.txt.
      - run: python3 scripts/ci/check_hardcoded_model_ids.py
      # WAVE 14 amendment (T133): actions hardening check fails on unpinned uses: or permissive permissions.
      - run: python3 scripts/ci/check_pinned_actions.py
      # #1036: the public LiveKit dev key pair must not appear in tracked files.
      - run: python3 scripts/ci/check_livekit_default_keys.py

  pytest:
    name: Pytest (unit)
    needs: [pick-runner, changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ci/requirements-test.txt
      - run: pip install -r ci/requirements-test.txt
      - name: pytest
        # Tests that need Postgres, Qdrant, LLM keys or the network are marked
        # `integration` in src/conftest.py and skipped here.
        run: pytest -m "not integration" -q --timeout=60

  template-check:
    name: Generated template check (report-only)
    needs: [pick-runner, changes]
    if: needs.changes.outputs.projects == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python3 -m src.factory_pipeline.template_check

  template-build:
    name: Static RTL template build (report-only)
    needs: [pick-runner, changes]
    if: needs.changes.outputs.templates == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.docker || '"ubuntu-latest"') }}
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: templates/roxira-static-rtl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build static RTL template
        env:
          BUILD_LOG: ${{ runner.temp }}/template-build.log
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee "$BUILD_LOG"
          npm run build 2>&1 | tee -a "$BUILD_LOG"
          test -f out/index.html
          grep -q 'dir="rtl"' out/index.html
      - name: Report failure on the PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_LOG: ${{ runner.temp }}/template-build.log
          COMMENT: ${{ runner.temp }}/template-build-comment.md
        run: |
          {
            echo "<!-- ci-template-build -->"
            echo "### Static RTL template build failed (report-only)"
            echo
            echo "[Workflow details]($RUN_URL)"
            echo
            echo '```text'
            tail -100 "$BUILD_LOG"
            echo '```'
          } > "$COMMENT"
          gh pr comment "$PR" --body-file "$COMMENT"

  compose:
    name: Compose config
    needs: [pick-runner, changes]
    if: needs.changes.outputs.compose == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.docker || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compose policy (report only)
        run: |
          python3 -m pip install pyyaml
          python3 scripts/ci/compose_policy.py docker-compose.prod.yml docker/research-stack/docker-compose.yml
      - name: docker compose config
        # ci/compose.env holds dummy values for every required (${VAR:?}) variable.
        # A new required variable that is not added there fails this step.
        run: |
          cp ci/compose.env .env
          docker compose --env-file ci/compose.env -f docker-compose.prod.yml config -q

  migration-lint:
    name: Migration ids + Squawk (new migrations only)
    needs: [pick-runner, changes]
    if: needs.changes.outputs.migrations == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Migration id check (blocking)
        run: |
          # The id must be above the newest id on main's tip, not above the merge base.
          git fetch --no-tags origin main
          python3 scripts/dev/check_migration_ids.py --base origin/main
      - name: Squawk on new migrations (not-null and robust-stmts rules block)
        run: |
          # Official release binary; the pinned version and SHA-256 live in install_squawk.sh.
          SQUAWK="$(bash scripts/dev/install_squawk.sh "$RUNNER_TEMP/squawk")"
          export SQUAWK
          python3 scripts/dev/lint_migrations_squawk.py --base origin/main

  frontend:
    name: Frontend lint + build
    needs: [pick-runner, changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.docker || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: output_apps/enterprise_hub/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: output_apps/enterprise_hub/frontend/package-lock.json
      - run: npm ci
      - name: oxlint (T202, runs before ESLint)
        # Pre-existing findings (same class as the ESLint ones): report, do not block. Flip to blocking once clean.
        continue-on-error: true
        run: npm run lint:oxlint
      - name: npm run lint
        # ESLint keeps only the rules oxlint does not cover (eslint-plugin-oxlint in eslint.config.mjs).
        # ~28 pre-existing ESLint errors: report, do not block. Flip to blocking once clean.
        continue-on-error: true
        run: |
          set +e
          npm run lint -- --format json --output-file "$RUNNER_TEMP/eslint.json" > /dev/null
          code=$?
          npm run lint
          node -e 'const r=require(process.argv[1]);const e=r.reduce((a,f)=>a+f.errorCount,0),w=r.reduce((a,f)=>a+f.warningCount,0);console.log(`### ESLint\n**${e}** errors, **${w}** warnings (non-blocking).`)' \
            "$RUNNER_TEMP/eslint.json" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend (tsc + jest + Postgres specs)
    needs: [pick-runner, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.docker || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: output_apps/enterprise_hub
    services:
      postgres:
        # Same major version as production (docker-compose.prod.yml, fresh_db_migrate.sh).
        # Hosted runners use mirror.gcr.io/library to avoid anonymous public.ecr.aws data limits (#1076);
        # the self-hosted CI box uses public.ecr.aws/docker/library (mirror.gcr.io is blocked there).
        image: ${{ needs.pick-runner.outputs.image_registry || vars.CI_IMAGE_REGISTRY || 'mirror.gcr.io/library' }}/postgres:17
        env:
          # Throwaway service container: the pg specs connect without a password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rxfresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rxfresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      # Admin user: only migrations run here. The pg specs create roxira_app themselves (test-pg.ts).
      DATABASE_USER: postgres
      DATABASE_NAME: rxfresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: psql client on the CI box (shim to the Postgres service container)
        # GitHub-hosted images ship psql; the box host may not (08_root_ci_pool.sh installs it).
        if: runner.environment == 'self-hosted'
        env:
          PG_CTR: ${{ job.services.postgres.id }}
        run: |
          if command -v psql >/dev/null 2>&1; then psql --version; exit 0; fi
          mkdir -p "$RUNNER_TEMP/pgbin"
          printf '#!/bin/sh\nexec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD %s psql "$@"\n' "$PG_CTR" > "$RUNNER_TEMP/pgbin/psql"
          chmod +x "$RUNNER_TEMP/pgbin/psql"
          echo "$RUNNER_TEMP/pgbin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: output_apps/enterprise_hub/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: oxlint (T202)
        # Pre-existing findings (unused imports, useless escapes): report, do not block.
        continue-on-error: true
        run: npm run lint:oxlint
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: Fresh migrations on an empty database
        run: npm run migration:run
      - name: RLS coverage gate (T192)
        # Every tenant_id table needs ENABLE + FORCE RLS and a tenant policy; global tables are in scripts/dev/rls_allowlist.txt.
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: rxfresh
        run: bash ../../scripts/dev/rls_coverage.sh
      - name: Jest unit specs
        # *.pg.spec.ts skip themselves without ROXIRA_TEST_PG_HOST; they run in the next step.
        run: npx jest --testPathIgnorePatterns '/node_modules/' '/frontend/' '/dist/' '\.pg\.spec\.ts$'
      - name: Jest Postgres specs
        # Each spec creates and drops its own database on this server.
        env:
          ROXIRA_TEST_PG_HOST: 127.0.0.1
          ROXIRA_TEST_PG_PORT: "5432"
          ROXIRA_TEST_PG_USER: postgres
        run: npx jest --runInBand --testPathPattern '\.pg\.spec\.ts$'

  typescript7:
    # T202: TypeScript 7 (native compiler) type-check, installed as the alias `typescript7` so the
    # build and ts-jest keep TypeScript 5.9. REPORT-ONLY: continue-on-error, not a required check.
    name: TypeScript 7 type-check (report-only)
    needs: [pick-runner, changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.docker || '"ubuntu-latest"') }}
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
        include:
          - app: backend
            dir: output_apps/enterprise_hub
          - app: frontend
            dir: output_apps/enterprise_hub/frontend
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: tsc 7 --noEmit (never fails the job; result goes to the summary)
        run: |
          set +e
          npm run typecheck:ts7 > "$RUNNER_TEMP/ts7.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/ts7.log"
          {
            echo "### TypeScript 7 (${{ matrix.app }}), report-only"
            echo "Exit code: $code, $(grep -c 'error TS' "$RUNNER_TEMP/ts7.log") errors."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  m1-shards:
    # Issue #116 / docs/testing/M1_GATE.md, #1261. Three Playwright shards, each with its own stack and
    # Postgres. The check named 'M1 gate (Playwright)' is the aggregating job m1-gate below.
    name: M1 shard ${{ matrix.shard }}/3
    needs: [pick-runner, changes]
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.docker || '"ubuntu-latest"') }}
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ needs.pick-runner.outputs.image_registry || vars.CI_IMAGE_REGISTRY || 'mirror.gcr.io/library' }}/postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rxfresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rxfresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: ${{ needs.pick-runner.outputs.image_registry || vars.CI_IMAGE_REGISTRY || 'mirror.gcr.io/library' }}/redis:7.2
        ports:
          # Host port 16379: 6379 is taken on the CI box (phone stack); same on hosted runners.
          - 16379:6379
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      # The service uses trust auth, the value is ignored but the app requires the key.
      DATABASE_PASSWORD: ci-trust-auth
      DATABASE_NAME: rxfresh
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "16379"
      # Throwaway per-run secret for this job's own backend; never a real key.
      JWT_SECRET: ci-m1-gate-throwaway-secret-0123456789abcdef
      JWT_SECRET_KEY: ci-m1-gate-throwaway-secret-0123456789abcdef
      NEST_API_ORIGIN: http://127.0.0.1:3000
      JUDGE_API_ORIGIN: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: psql client on the CI box (shim to the Postgres service container)
        # GitHub-hosted images ship psql; the box host may not (08_root_ci_pool.sh installs it).
        if: runner.environment == 'self-hosted'
        env:
          PG_CTR: ${{ job.services.postgres.id }}
        run: |
          if command -v psql >/dev/null 2>&1; then psql --version; exit 0; fi
          mkdir -p "$RUNNER_TEMP/pgbin"
          printf '#!/bin/sh\nexec docker exec -i -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD %s psql "$@"\n' "$PG_CTR" > "$RUNNER_TEMP/pgbin/psql"
          chmod +x "$RUNNER_TEMP/pgbin/psql"
          echo "$RUNNER_TEMP/pgbin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Backend install, build, fresh migrations
        working-directory: output_apps/enterprise_hub
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run migration:run
      - name: Create the app role (NOSUPERUSER NOBYPASSRLS, as in production)
        # Migrations and the session minting below keep the admin user (job-level DATABASE_USER);
        # the backend itself must run as roxira_app so RLS applies to its own queries.
        run: bash scripts/ci/create_app_role.sh
      - name: Start backend (:3000)
        working-directory: output_apps/enterprise_hub
        env:
          NODE_ENV: production
          PORT: "3000"
          DATABASE_USER: roxira_app
          # CI-only literal, same as test/support/test-pg.ts; the service container is throwaway.
          DATABASE_PASSWORD: app-role-test-only
        run: |
          nohup node dist/main > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            grep -q "successfully started" "$RUNNER_TEMP/backend.log" && exit 0
            sleep 2
          done
          echo "::error::backend did not start"; tail -40 "$RUNNER_TEMP/backend.log"; exit 1
      - name: Frontend install, build, start (:3001)
        working-directory: output_apps/enterprise_hub/frontend
        run: |
          npm ci
          npm run build
          PORT=3001 HOSTNAME=127.0.0.1 nohup npm run start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 45); do
            curl -fs -o /dev/null http://127.0.0.1:3001/ && exit 0
            sleep 2
          done
          echo "::error::frontend did not start"; tail -40 "$RUNNER_TEMP/frontend.log"; exit 1
      - name: Mint throwaway tenant sessions
        working-directory: output_apps/enterprise_hub
        run: |
          NODE_PATH="$PWD/node_modules" node ../../scripts/ci/mint_e2e_session.js "$RUNNER_TEMP/session.m1.json"
          NODE_PATH="$PWD/node_modules" node ../../scripts/ci/mint_e2e_session.js "$RUNNER_TEMP/session.m1-accountant.json"
      - name: Playwright version (cache key)
        id: pw
        working-directory: e2e
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers (hosted runners)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright (chromium)
        working-directory: e2e
        env:
          # The browser CDN is blocked from the CI box network; the box hub seeds this dir through its
          # proxy (scripts/ops/ci_box/jit_pool/seed_playwright.sh). Empty on hosted runners.
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.environment == 'self-hosted' && (vars.CI_BOX_PLAYWRIGHT_PATH || '/srv/data/ci-jit/ms-playwright') || '' }}
        run: |
          npm ci
          npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps ' || '' }}chromium \
            || { [ -z "$PLAYWRIGHT_BROWSERS_PATH" ] || echo "::error::Playwright browsers missing on the box: run scripts/ops/ci_box/jit_pool/seed_playwright.sh as mahanfilms"; exit 1; }
      - name: Run the M1 gate (shard ${{ matrix.shard }}/3)
        working-directory: e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.environment == 'self-hosted' && (vars.CI_BOX_PLAYWRIGHT_PATH || '/srv/data/ci-jit/ms-playwright') || '' }}
          E2E_BASE_URL: http://127.0.0.1:3001
          APP_E2E_SESSION_FILE_M1: ${{ runner.temp }}/session.m1.json
          APP_E2E_SESSION_FILE_ACCOUNTANT: ${{ runner.temp }}/session.m1-accountant.json
          CI: "true"
        run: npx playwright test m1-shop-month m1-accountant-day --project=chromium --reporter=list,html --shard=${{ matrix.shard }}/3
      - name: Upload report and service logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m1-gate-report-shard-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: ignore
          retention-days: 7

  m1-gate:
    # Aggregate of the shards, keeps the original check name. REPORT-ONLY: continue-on-error, and it is
    # not a required check. Make it required (branch protection) only after the laptop developer says the
    # gate is stable.
    name: M1 gate (Playwright)
    needs: [pick-runner, changes, m1-shards]
    if: always() && needs.changes.outputs.e2e == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.docker || '"ubuntu-latest"') }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Fail if any shard did not succeed
        env:
          SHARDS_RESULT: ${{ needs.m1-shards.result }}
        run: |
          echo "M1 shards result: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = "success" ]

  smoke-axe-gate:
    name: Smoke + axe gate (Playwright)
    needs: [pick-runner, changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.docker || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            output_apps/enterprise_hub/frontend/package-lock.json
            e2e/package-lock.json
      - name: Frontend install, build, start (:3001)
        working-directory: output_apps/enterprise_hub/frontend
        run: |
          npm ci
          npm run build
          PORT=3001 HOSTNAME=127.0.0.1 nohup npm run start > "$RUNNER_TEMP/frontend-smoke.log" 2>&1 &
          for i in $(seq 1 45); do
            curl -fs -o /dev/null http://127.0.0.1:3001/ && exit 0
            sleep 2
          done
          echo "::error::frontend did not start"; tail -40 "$RUNNER_TEMP/frontend-smoke.log"; exit 1
      - name: Install Playwright (chromium)
        working-directory: e2e
        env:
          # The browser CDN is blocked from the CI box network; the box hub seeds this dir through its
          # proxy (scripts/ops/ci_box/jit_pool/seed_playwright.sh). Empty on hosted runners.
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.environment == 'self-hosted' && (vars.CI_BOX_PLAYWRIGHT_PATH || '/srv/data/ci-jit/ms-playwright') || '' }}
        run: |
          npm ci
          npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps ' || '' }}chromium \
            || { [ -z "$PLAYWRIGHT_BROWSERS_PATH" ] || echo "::error::Playwright browsers missing on the box: run scripts/ops/ci_box/jit_pool/seed_playwright.sh as mahanfilms"; exit 1; }
      - name: Run Playwright smoke + axe gate
        working-directory: e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.environment == 'self-hosted' && (vars.CI_BOX_PLAYWRIGHT_PATH || '/srv/data/ci-jit/ms-playwright') || '' }}
          E2E_BASE_URL: http://127.0.0.1:3001
          CI: "true"
        run: npx playwright test tests/smoke/ --project=chromium --reporter=list,html
      - name: Upload smoke report and log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-axe-report
          path: |
            e2e/playwright-report
            ${{ runner.temp }}/frontend-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  frontend-gate:
    name: Frontend gate
    # Always runs so it can be a required check even on PRs with no frontend
    # changes, where the `frontend` job is skipped. It needs both the change
    # detector (to tell "skipped because nothing changed" from a real skip) and
    # the frontend job itself.
    needs: [pick-runner, changes, frontend]
    if: always()
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.light || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Verify frontend result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          echo "changes=$CHANGES_RESULT frontend=$FRONTEND_RESULT frontend_changed=$FRONTEND_CHANGED"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Detect changes job ended as '$CHANGES_RESULT'; cannot verify frontend."
            exit 1
          fi
          case "$FRONTEND_RESULT" in
            success)
              echo "Frontend lint + build passed."
              ;;
            skipped)
              # The only legitimate skip is dorny/paths-filter reporting no
              # frontend files changed (frontend_changed != true).
              if [ "$FRONTEND_CHANGED" = "true" ]; then
                echo "::error::Frontend job was skipped even though frontend files changed."
                exit 1
              fi
              echo "No frontend files changed; frontend job skipped as expected."
              ;;
            *)
              echo "::error::Frontend job ended as '$FRONTEND_RESULT'."
              exit 1
              ;;
          esac
