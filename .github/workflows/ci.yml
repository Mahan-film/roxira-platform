name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The server daemon pushes an audit commit to main every ~30 minutes that only
    # touches these generated reports. Skip CI for those pushes.
    paths-ignore:
      - "output_apps/enterprise_hub/frontend/public/autonomous_dashboard.json"
      - "output_apps/enterprise_hub/frontend/public/tech_radar_report.json"
      - "TECH_RADAR_*"
      - "**/*.md"
  # A PR opened with the default GITHUB_TOKEN (as agent-task.yml's agent PRs are)
  # does not trigger `pull_request` events — a deliberate GitHub anti-recursion
  # rule. agent-task.yml dispatches this workflow directly on the new branch via
  # `gh workflow run ci.yml --ref <branch>` so agent PRs still get a real CI run.
  workflow_dispatch:
  # GitHub merge queue: the queue creates a temporary gh-readonly-queue/* branch and
  # requests checks on it. Required status checks must be reported for this event too.
  merge_group:
    types: [checks_requested]

concurrency:
  # Merge-queue groups each have their own head_ref, so they never cancel each other.
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  SEMGREP_VERSION: "1.178.0"
  TRIVY_VERSION: "0.75.0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      compose: ${{ steps.filter.outputs.compose }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      projects: ${{ steps.filter.outputs.projects }}
      templates: ${{ steps.filter.outputs.templates }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # workflow_dispatch (used to run CI on agent-task.yml's PR branches, since a
          # PR opened with GITHUB_TOKEN doesn't trigger pull_request events) has no
          # natural "before" commit to diff against, unlike push/pull_request; give it
          # one explicitly. Left empty for push/pull_request so their own automatic
          # base detection (unaffected by this input) keeps working.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || (github.event_name == 'workflow_dispatch' && 'main' || '') }}
          # merge_group has no automatic base detection either: diff the queue's temporary
          # merge commit against the base it will land on. Other events keep the action's
          # own default (github.ref).
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.ref }}
          filters: |
            python:
              - "**/*.py"
              - "pyproject.toml"
              - "ci/requirements-test.txt"
              - ".github/workflows/ci.yml"
            compose:
              - "docker-compose.prod.yml"
              - "docker/research-stack/docker-compose.yml"
              - "ci/compose.env"
              - "scripts/ci/compose_policy.py"
              - ".github/workflows/ci.yml"
            frontend:
              - "output_apps/enterprise_hub/frontend/**"
              - ".github/workflows/ci.yml"
            backend:
              - "output_apps/enterprise_hub/**"
              - ".github/workflows/ci.yml"
            projects:
              - "projects/**"
              - ".github/workflows/ci.yml"
            templates:
              - "templates/**"
              - ".github/workflows/ci.yml"
            e2e:
              - "e2e/**"
              - "output_apps/enterprise_hub/**"
              - "scripts/ci/mint_e2e_session.js"
              - ".github/workflows/ci.yml"

  gitleaks:
    name: Secret scan (new commits only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Blobless clone: full commit graph, blobs fetched lazily only for the scanned range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Self-test (a new fake token must be caught)
        run: |
          t=$(mktemp -d) && cp .gitleaks.toml "$t/" && cd "$t"
          git init -q && git -c user.email=ci@ci -c user.name=ci commit -q --allow-empty -m base
          echo "token = \"ghp_$(openssl rand -hex 18)\"" > leak.py
          git add leak.py && git -c user.email=ci@ci -c user.name=ci commit -q -m leak
          set +e
          gitleaks git --config .gitleaks.toml --log-opts="HEAD~1..HEAD" --no-banner --exit-code 42 .
          if [ $? -ne 42 ]; then
            echo "::error::gitleaks did not catch a fake token; check .gitleaks.toml"; exit 1
          fi
      - name: Scan commits introduced by this change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          # History already contains secrets on purpose (see docs/STRATEGY.md §6), so only
          # the commits this PR/push adds are scanned. Removing a secret never fails.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "Scanning $RANGE"
          gitleaks git --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner --verbose .

  trivy-fs:
    name: Trivy filesystem scan (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
      - name: Scan filesystem
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format table . > "$RUNNER_TEMP/trivy-fs.txt"
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: ${{ runner.temp }}/trivy-fs.txt
          if-no-files-found: warn

  semgrep:
    name: Semgrep (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Run custom rules
        run: semgrep --config .semgrep/roxira.yml --metrics=off output_apps src scripts

  ruff:
    name: Ruff (non-blocking)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff>=0.16.2,<0.17"
      - name: ruff check
        id: ruff
        # Thousands of pre-existing violations: report, do not block. Flip to blocking once the count reaches 0.
        continue-on-error: true
        run: |
          set +e
          ruff check . --output-format=github
          code=$?
          count=$(ruff check . --output-format=concise --quiet | grep -c ':' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Ruff"
            echo "**$count** violations (non-blocking)."
            echo
            echo '```'
            ruff check . --statistics | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Report count on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ steps.ruff.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="<!-- ci-ruff-count -->
          **Ruff:** ${COUNT} violations (non-blocking). [Details]($RUN_URL)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- ci-ruff-count -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  undefined-names:
    name: Undefined names
    # Always runs (no change filter), like Frontend gate, so it can be a required
    # check on every PR. This is the F821/F822/F823 guard for issue #122: a deleted
    # function whose call sites remained must fail instead of shipping.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff check (undefined names)
        # Blocking on purpose (no continue-on-error). The two --exclude files do not
        # parse today (pre-existing, issue #122) and must be fixed or deleted in a
        # follow-up before this check can drop its excludes.
        run: |
          python3 -m pip install ruff && ruff check --select F821,F822,F823 output_apps/generated_modules/smartjudge output_apps/ecosystem_core/src src --exclude output_apps/ecosystem_core/src/crawlers/roxira_factory_core.py --exclude src/legal_intelligence/inject_remaining_corpus.py

  system-inventory:
    name: System inventory up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # If this fails, run `python3 scripts/gen_system_inventory.py` and commit docs/SYSTEM_INVENTORY.generated.md.
      - run: python3 -m pip install pyyaml && python3 scripts/gen_system_inventory.py --check
      # AGENTS.md section 3: model ids live in config/models.yaml only. Baseline: scripts/ci/hardcoded_model_ids_baseline.txt.
      - run: python3 scripts/ci/check_hardcoded_model_ids.py

  pytest:
    name: Pytest (unit)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ci/requirements-test.txt
      - run: pip install -r ci/requirements-test.txt
      - name: pytest
        # Tests that need Postgres, Qdrant, LLM keys or the network are marked
        # `integration` in src/conftest.py and skipped here.
        run: pytest -m "not integration" -q --timeout=60

  template-check:
    name: Generated template check (report-only)
    needs: changes
    if: needs.changes.outputs.projects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python3 -m src.factory_pipeline.template_check

  template-build:
    name: Static RTL template build (report-only)
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: templates/roxira-static-rtl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build static RTL template
        env:
          BUILD_LOG: ${{ runner.temp }}/template-build.log
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee "$BUILD_LOG"
          npm run build 2>&1 | tee -a "$BUILD_LOG"
          test -f out/index.html
          grep -q 'dir="rtl"' out/index.html
      - name: Report failure on the PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_LOG: ${{ runner.temp }}/template-build.log
          COMMENT: ${{ runner.temp }}/template-build-comment.md
        run: |
          {
            echo "<!-- ci-template-build -->"
            echo "### Static RTL template build failed (report-only)"
            echo
            echo "[Workflow details]($RUN_URL)"
            echo
            echo '```text'
            tail -100 "$BUILD_LOG"
            echo '```'
          } > "$COMMENT"
          gh pr comment "$PR" --body-file "$COMMENT"

  compose:
    name: Compose config
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compose policy (report only)
        run: |
          python3 -m pip install pyyaml
          python3 scripts/ci/compose_policy.py docker-compose.prod.yml docker/research-stack/docker-compose.yml
      - name: docker compose config
        # ci/compose.env holds dummy values for every required (${VAR:?}) variable.
        # A new required variable that is not added there fails this step.
        run: |
          cp ci/compose.env .env
          docker compose --env-file ci/compose.env -f docker-compose.prod.yml config -q

  frontend:
    name: Frontend lint + build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: output_apps/enterprise_hub/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: output_apps/enterprise_hub/frontend/package-lock.json
      - run: npm ci
      - name: npm run lint
        # ~28 pre-existing ESLint errors: report, do not block. Flip to blocking once clean.
        continue-on-error: true
        run: |
          set +e
          npm run lint -- --format json --output-file "$RUNNER_TEMP/eslint.json" > /dev/null
          code=$?
          npm run lint
          node -e 'const r=require(process.argv[1]);const e=r.reduce((a,f)=>a+f.errorCount,0),w=r.reduce((a,f)=>a+f.warningCount,0);console.log(`### ESLint\n**${e}** errors, **${w}** warnings (non-blocking).`)' \
            "$RUNNER_TEMP/eslint.json" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend (tsc + jest + Postgres specs)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: output_apps/enterprise_hub
    services:
      postgres:
        # Same major version as production (docker-compose.prod.yml, fresh_db_migrate.sh).
        image: postgres:17
        env:
          # Throwaway service container: the pg specs connect without a password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rxfresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rxfresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_NAME: rxfresh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: output_apps/enterprise_hub/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: Fresh migrations on an empty database
        run: npm run migration:run
      - name: Jest unit specs
        # *.pg.spec.ts skip themselves without ROXIRA_TEST_PG_HOST; they run in the next step.
        run: npx jest --testPathIgnorePatterns '/node_modules/' '/frontend/' '/dist/' '\.pg\.spec\.ts$'
      - name: Jest Postgres specs
        # Each spec creates and drops its own database on this server.
        env:
          ROXIRA_TEST_PG_HOST: 127.0.0.1
          ROXIRA_TEST_PG_PORT: "5432"
          ROXIRA_TEST_PG_USER: postgres
        run: npx jest --runInBand --testPathPattern '\.pg\.spec\.ts$'

  m1-gate:
    # Issue #116 / docs/testing/M1_GATE.md. REPORT-ONLY: continue-on-error, and it is not a required check.
    # Make it required (branch protection) only after the laptop developer says the gate is stable.
    name: M1 gate (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rxfresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rxfresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      # The service uses trust auth, the value is ignored but the app requires the key.
      DATABASE_PASSWORD: ci-trust-auth
      DATABASE_NAME: rxfresh
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      # Throwaway per-run secret for this job's own backend; never a real key.
      JWT_SECRET: ci-m1-gate-throwaway-secret-0123456789abcdef
      JWT_SECRET_KEY: ci-m1-gate-throwaway-secret-0123456789abcdef
      NEST_API_ORIGIN: http://127.0.0.1:3000
      JUDGE_API_ORIGIN: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Backend install, build, fresh migrations
        working-directory: output_apps/enterprise_hub
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run migration:run
      - name: Start backend (:3000)
        working-directory: output_apps/enterprise_hub
        env:
          NODE_ENV: production
          PORT: "3000"
        run: |
          nohup node dist/main > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            grep -q "successfully started" "$RUNNER_TEMP/backend.log" && exit 0
            sleep 2
          done
          echo "::error::backend did not start"; tail -40 "$RUNNER_TEMP/backend.log"; exit 1
      - name: Frontend install, build, start (:3001)
        working-directory: output_apps/enterprise_hub/frontend
        run: |
          npm ci
          npm run build
          PORT=3001 HOSTNAME=127.0.0.1 nohup npm run start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 45); do
            curl -fs -o /dev/null http://127.0.0.1:3001/ && exit 0
            sleep 2
          done
          echo "::error::frontend did not start"; tail -40 "$RUNNER_TEMP/frontend.log"; exit 1
      - name: Mint a throwaway tenant session
        working-directory: output_apps/enterprise_hub
        run: NODE_PATH="$PWD/node_modules" node ../../scripts/ci/mint_e2e_session.js "$RUNNER_TEMP/session.m1.json"
      - name: Install Playwright (chromium)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the M1 gate
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3001
          APP_E2E_SESSION_FILE_M1: ${{ runner.temp }}/session.m1.json
          CI: "true"
        run: npx playwright test m1-shop-month --project=chromium --reporter=list,html
      - name: Run the cheques UI spec (report-only, same stack)
        # Issue #376: drives /app/cheques in a browser; the whole job stays continue-on-error.
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3001
          APP_E2E_SESSION_FILE: ${{ runner.temp }}/session.m1.json
          CI: "true"
        run: npx playwright test tests/cheques.spec.ts --project=chromium --reporter=list
      - name: Upload report and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-gate-report
          path: |
            e2e/playwright-report
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: ignore
          retention-days: 7

  frontend-gate:
    name: Frontend gate
    # Always runs so it can be a required check even on PRs with no frontend
    # changes, where the `frontend` job is skipped. It needs both the change
    # detector (to tell "skipped because nothing changed" from a real skip) and
    # the frontend job itself.
    needs: [changes, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify frontend result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          echo "changes=$CHANGES_RESULT frontend=$FRONTEND_RESULT frontend_changed=$FRONTEND_CHANGED"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Detect changes job ended as '$CHANGES_RESULT'; cannot verify frontend."
            exit 1
          fi
          case "$FRONTEND_RESULT" in
            success)
              echo "Frontend lint + build passed."
              ;;
            skipped)
              # The only legitimate skip is dorny/paths-filter reporting no
              # frontend files changed (frontend_changed != true).
              if [ "$FRONTEND_CHANGED" = "true" ]; then
                echo "::error::Frontend job was skipped even though frontend files changed."
                exit 1
              fi
              echo "No frontend files changed; frontend job skipped as expected."
              ;;
            *)
              echo "::error::Frontend job ended as '$FRONTEND_RESULT'."
              exit 1
              ;;
          esac
