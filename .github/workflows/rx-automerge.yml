name: RX auto-merge

# Server-side merge gate for rx `issue-<n>` PRs. Trusted code on the default
# branch decides; the PR's own code is never checked out or executed.
# See docs/ops/RX_AUTOMERGE.md.

on:
  workflow_run:
    workflows: ["CI", "Agent review"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate"
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: rx-automerge
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: >-
      vars.AUTO_MERGE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target') &&
      startsWith(github.event.workflow_run.head_branch, 'issue-')))
    steps:
      - name: Check out the default branch (never the PR head)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run merge gate
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          ALLOWED: ${{ vars.AGENT_ALLOWED_ACTORS || 'mahan-films' }}
          MERGE_BOT_TOKEN: ${{ secrets.MERGE_BOT_TOKEN }}
        run: python3 scripts/ci/merge_gate_run.py
