name: Review desk

# Cross-family PR review desk (scripts/dev/review_desk.py) on a schedule, so reviews no longer depend on
# a laptop being on. No Claude: models come from config/models.yaml role `review_desk` (Gemini direct
# first, OpenRouter last; the author's own model family is skipped). It only reads PR diffs through the
# API and posts one comment per PR head; it never checks out or runs PR code, so secrets stay safe on
# schedule / workflow_dispatch (no pull_request trigger on purpose).

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Review only this PR number (empty = every open PR not reviewed at its head)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-desk
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: python -m pip install --quiet pyyaml
      - name: Review open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_DESK_PROXY: ""
          PR_INPUT: ${{ inputs.pr }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          OPENROUTER_API_KEY_AGENTS: ${{ secrets.OPENROUTER_API_KEY_AGENTS }}
        run: |
          if [ -n "$PR_INPUT" ]; then
            case "$PR_INPUT" in (*[!0-9]*) echo "pr must be a number"; exit 2;; esac
            python scripts/dev/review_desk.py --pr "$PR_INPUT" --max 1
          else
            python scripts/dev/review_desk.py --max 8
          fi
