# Auth / OTP routes on the server blocks that do NOT proxy /api/ to FastAPI
# directly (roxira.ir, roxira.net). Today these paths fall through to
# `location /` -> Next.js ($frontend_backend), which rewrites them. This
# location keeps exactly that upstream and header set (proxy_hide_header
# Referrer-Policy and add_header come from the server-level
# security_headers.conf include, inherited because this location sets none),
# and only adds the auth_otp rate limit.
location ~ ^/api/(?:v1/auth(?:/|$)|v1/apps/judge/(?:auth/|unifiedauth/|send-otp|verify-otp)|judge/(?:auth/|unifiedauth/|send-otp|verify-otp)) {
    limit_req zone=auth_otp burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://$frontend_backend;
    include /etc/nginx/snippets/proxy_upgrade.conf;
    include /etc/nginx/snippets/proxy_headers.conf;
}
