# Standard forwarded headers. X-Forwarded-For is overwritten with $remote_addr (real-IP
# resolved, see nginx.conf), never appended to a client-supplied value.
# Included by the auth_limit_* snippets.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
