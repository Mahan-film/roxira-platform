# Auth / OTP routes served by the FastAPI core (server blocks that proxy /api/ to
# it). Each location mirrors the location that serves the path today
# (`location /api/` or `/api/v1/apps/judge/` or `/api/judge/`): same upstream,
# headers, timeouts, buffering and the same pre-existing limit zone, plus
# auth_otp (10 r/m per real client IP, burst 5). nginx applies every limit_req
# in a location, so the stricter zone wins. proxy_hide_header / add_header come
# from the server-level security_headers.conf include (inherited).
location ~ ^/api/v1/auth(?:/|$) {
    limit_req zone=api burst=60 nodelay;
    limit_req zone=auth_otp burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://$judge_backend;
    include /etc/nginx/snippets/proxy_upgrade.conf;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}

location ~ ^/api/v1/apps/judge/(?:auth/|unifiedauth/|send-otp|verify-otp) {
    limit_req zone=auth burst=5 nodelay;
    limit_req zone=auth_otp burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://$judge_backend;
    include /etc/nginx/snippets/proxy_upgrade.conf;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

# Same-origin alias used by the chat UI: /api/judge/<x> -> /api/v1/apps/judge/<x>
# (`location /api/judge/` has no limit, timeouts or upgrade headers today).
# Its proxy_pass URI drops the suffix (variable + URI); the rewrite here keeps it.
location ~ ^/api/judge/(?:auth/|unifiedauth/|send-otp|verify-otp) {
    limit_req zone=auth burst=5 nodelay;
    limit_req zone=auth_otp burst=5 nodelay;
    limit_req_status 429;
    rewrite ^/api/judge/(.*)$ /api/v1/apps/judge/$1 break;
    proxy_pass http://$judge_backend;
    include /etc/nginx/snippets/proxy_headers.conf;
}
