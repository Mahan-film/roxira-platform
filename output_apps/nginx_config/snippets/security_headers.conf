# Shared security headers (included once per server block).
# NOTE: nginx drops inherited add_header directives in any location that sets
# its own add_header; include this file there too if that location needs them.
proxy_hide_header Referrer-Policy;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Permitted-Cross-Domain-Policies none always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(self), microphone=(self)" always;
# 180 days. No "preload" yet: raise to 31536000 + preload only after every
# subdomain has been confirmed HTTPS-only (see docs/security audit finding 8).
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
# Still report-only (not enforced): 'unsafe-inline' must be removed first.
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss: https:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
