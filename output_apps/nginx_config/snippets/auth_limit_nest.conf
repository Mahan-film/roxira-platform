# NestJS CREDENTIAL routes only (login, signup, OTP, password reset, passkey login)
# behind /api/backend/. Read-only/authenticated routes (me, organizations, sessions,
# refresh, ...) are NOT matched here: they fall through to `location /api/backend/`
# (zone=api, burst 60). Issue #149: the strict zone 429'd GET /auth/organizations.
# Same upstream and headers as `location /api/backend/`, plus the auth_otp limit.
# `location /api/backend/` uses `rewrite ... break;` + a bare `proxy_pass http://$var;`
# (a variable proxy_pass WITH a URI drops the request path). This location keeps
# that same pattern so the auth routes reach the NestJS controllers
# (VersioningType.URI: /v1/<rest>).
location ~ ^/api/backend/auth/(?:send-otp|verify-otp|signup|login|login/mfa|password/(?:forgot|reset)|webauthn/authentication/(?:options|verify))/?$ {
    limit_req zone=auth_otp burst=5 nodelay;
    limit_req_status 429;
    rewrite ^/api/backend/(.*)$ /v1/$1 break;
    proxy_pass http://$enterprise_backend;
    include /etc/nginx/snippets/proxy_headers.conf;
}
