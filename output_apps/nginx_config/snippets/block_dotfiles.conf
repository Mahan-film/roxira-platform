# Never serve hidden files or leftover dumps/backups (.git, .env, .htaccess, *.sql, *.bak ...).
# Included in every public server block. Regex locations win over prefix locations
# (including `location /` that proxies to the apps), so this holds even if an upstream
# would serve such a path. /.well-known/ is excluded (ACME HTTP-01 challenge and
# other standard files).
location ~ /\.(?!well-known(?:/|$)) {
    access_log off;
    return 404;
}
location ~* \.(?:sql|bak|swp|orig|old|env)$ {
    access_log off;
    return 404;
}
