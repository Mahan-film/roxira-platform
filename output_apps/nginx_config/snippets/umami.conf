# Umami analytics (services/analytics, container roxira_umami on roxira_net). The public sites expose only
# what the tracker needs, same-origin under /umami/ (script.js and /api/send); the prefix is stripped because
# the official image serves from / (Umami's base path is a build-time setting). The admin UI is NOT public:
# use an ssh tunnel to 127.0.0.1:3005. The upstream is a variable so nginx resolves it per request through the
# Docker resolver (resolver 127.0.0.11 in nginx.conf) and still starts when Umami is down.
location = /umami/script.js {
    set $umami_upstream http://roxira_umami:3000;
    rewrite ^/umami/(.*)$ /$1 break;
    proxy_pass $umami_upstream;
    proxy_set_header Host $host;
    expires 1h;
}
location = /umami/api/send {
    set $umami_upstream http://roxira_umami:3000;
    rewrite ^/umami/(.*)$ /$1 break;
    proxy_pass $umami_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
