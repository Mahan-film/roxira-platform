# Umami analytics (services/analytics, container roxira_umami on roxira_net). Same-origin /umami/ on both
# public sites. The upstream is a variable so nginx resolves it at request time through the Docker resolver
# (resolver 127.0.0.11 in nginx.conf): nginx still starts when Umami is down (requests then get 502).
location /umami/ {
    set $umami_upstream http://roxira_umami:3000;
    proxy_pass $umami_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
