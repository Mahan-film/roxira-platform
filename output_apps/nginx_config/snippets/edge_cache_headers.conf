# Public, cookie-free SEO pages that Cloudflare may cache at the edge
# (/laws, /regulations, /guides and the sitemaps). Included ONLY from the
# dedicated locations in nginx.conf, never from /api, /chat, /owner, /admin,
# auth, payment or verify-email.
#
# Next.js overwrites Cache-Control set in next.config headers() for pages in
# production and these pages are force-dynamic, so the edge policy is set here.
# Any add_header in a location drops the inherited server-level ones, so the
# shared security headers are re-included first. No `always`: only 2xx/3xx responses get the header, so errors are never cached.
include /etc/nginx/snippets/security_headers.conf;
proxy_hide_header Cache-Control;
proxy_hide_header Set-Cookie;
add_header Cache-Control "public, s-maxage=3600, stale-while-revalidate=86400";
