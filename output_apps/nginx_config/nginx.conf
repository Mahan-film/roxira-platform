events { worker_connections 1024; }
http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # auth/OTP routes (FastAPI + NestJS), see snippets/auth_limit_*.conf
    limit_req_zone $binary_remote_addr zone=auth_otp:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    upstream twenty_crm_upstream {
        server 127.0.0.1:3002;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 50M;
    # slow-client / slowloris limits (do not affect proxy_read_timeout of long LLM or voice streams)
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 16k;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # حل نام میزبان کانتینرها از طریق DNS داخلی داکر تا با هر بار
    # recreate شدن یک کانتینر (IP جدید)، nginx به‌جای کش کردن دائمی
    # IP قدیمی، هر ۱۰ ثانیه دوباره resolve کند و خطای ۵۰۲ رخ ندهد.
    resolver 127.0.0.11 valid=10s;

    # ------------------------------------------------------------------
    # پیکربندی SSL/TLS مشترک و بهینه‌سازی Cloudflare (Flexible / Full / Strict)
    # ------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # بازیابی آی‌پی واقعی از Cloudflare.
    # baseline: nginx/cloudflare_params.conf (committed, IPv4+IPv6)
    # generated: nginx/generated/*.conf (scripts/ops/nginx/update_cloudflare_ips.sh,
    #            gitignored except the committed dotfile placeholder .keep.conf, so
    #            the host dir always exists). Repeated set_real_ip_from lines
    #            are harmless; a glob include that matches nothing is fine.
    include /etc/nginx/cloudflare/cloudflare_params.conf;
    include /etc/nginx/cloudflare/generated/*.conf;
    # CF-Connecting-IP is declared here only (never in the include files).
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # $remote_addr is now the real client IP: CF-Connecting-IP is honoured only when
    # the TCP peer is a Cloudflare range (roxira.net); a direct peer (roxira.ir) keeps its
    # own address and a forged CF-Connecting-IP / X-Forwarded-For is ignored. Every
    # proxy_set_header X-Forwarded-For below therefore OVERWRITES the header with
    # $remote_addr instead of appending to a client-supplied value, so upstreams
    # (Next.js route, NestJS Throttler) never see a spoofable leftmost entry.

    # نقشه‌ی هدرهای Upgrade/Connection برای پشتیبانی از WebSocket/HMR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # vhostهای سندباکسهای خودکار (Software Foundry)
    # قواعد تولیدشده توسط ephemeral_runner.py در این پوشه قرار می‌گیرند و
    # هر یک شامل یک بلوک upstream و یک بلوک server برای
    # {app_id}.roxira.net است. این پوشه باید از هاست به داخل این کانتینر
    # مانت شود (docker-compose.prod.yml → nginx_gateway.volumes).
    # ------------------------------------------------------------------
    include /opt/roxira_platform/nginx/sandboxes/*.conf;

    # frontend_upstream / judge_upstream / enterprise_backend حذف شدند؛
    # به‌جای upstream{} ثابت (که IP را فقط در بارگذاری/reload کش می‌کند)
    # از متغیر $judge_backend / $frontend_backend / $enterprise_backend
    # به همراه resolver بالا استفاده می‌شود تا با هر بار recreate شدن
    # کانتینر، nginx دوباره IP را resolve کند.

    # ==================================================================
    # CATCH-ALL — any request by raw IP or with an unknown Host is dropped (444).
    # Must stay the only default_server on 80/443. The self-signed cert exists
    # only so the TLS handshake can complete; generate it with
    # scripts/ops/nginx/gen_snakeoil_cert.sh (host dir nginx/ssl-default, mounted
    # at /etc/nginx/ssl-default). The container healthcheck uses the loopback
    # server below, not the public listeners.
    # ==================================================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate     /etc/nginx/ssl-default/snakeoil.crt;
        ssl_certificate_key /etc/nginx/ssl-default/snakeoil.key;
        return 444;
    }

    # Healthcheck listener: container loopback only, never published by compose.
    server {
        listen 127.0.0.1:8081;
        server_name _;
        access_log off;
        location = /nginx-health { return 200 "ok\n"; }
        location / { return 404; }
    }

    # ==================================================================
    # SERVER BLOCK 1 — سامانه قاضی هوشمند (Chat-First Legal Assistant)
    # دامنه‌ها: ghazihoushmand.ir / www.ghazihoushmand.ir
    # مسیر ریشه = رابط چت‌بات حقوقی؛ موتور هوش مصنوعی پایتون (AI Core).
    # ==================================================================
    server {
        listen 80;
        listen 443 ssl;

    # اولویت قطعی وب‌سوکت پیش از فرانت‌اند
    

        http2 on;
        server_name ghazihoushmand.ir www.ghazihoushmand.ir;
        set $judge_backend roxira_app_prod:8000;
        set $frontend_backend roxira_enterprise_frontend:3001;
        set $enterprise_backend roxira_enterprise_backend:3000;

        # پشتیبانی از استریم و وب‌سوکت گفتگوی صوتی زنده
        location ~ ^/api/v1/apps/judge/(live-voice|ws) {
            proxy_pass http://$judge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    
location /api/v1/payment/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$judge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    


    # اولویت قطعی وب‌سوکت تماس زنده قاضی هوشمند
    


    

    include /etc/nginx/snippets/security_headers.conf;
        include /etc/nginx/snippets/umami.conf;


        ssl_certificate     /etc/letsencrypt/live/ghazihoushmand.ir/fullchain.pem;

    # هدایت مستقیم وب‌سوکت به بک‌اند پایتون
    

        ssl_certificate_key /etc/letsencrypt/live/ghazihoushmand.ir/privkey.pem;

        add_header Content-Language fa always;

        
        

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location = /health {
            proxy_pass http://$judge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # دروازهٔ یکپارچهٔ API قاضی هوشمند — تمام ترافیک `/api/` این دامنه
        # مستقیماً و بدون هیچ واسطه‌ای به موتور پایتون (roxira_app_prod:8000)
        # پروکسی می‌شود. این قاعده تضمین می‌کند مسیرهای احراز هویت
        # (`/api/v1/apps/judge/auth/send-otp`) هرگز به لایه NestJS یا
        # rewriteهای Next.js نروند و خطای ۵۰۰/۵۰۴ رخ ندهد.
        # توجه: `proxy_pass` بدون اسلش انتهایی، مسیر کامل را حفظ می‌کند.
        # ------------------------------------------------------------------
        
        

    
    # اولویت قطعی وب‌سوکت تماس زنده قاضی هوشمند به آپ‌استریم معتبر
    

    include /etc/nginx/snippets/block_docs.conf;
    include /etc/nginx/snippets/block_dotfiles.conf;
    include /etc/nginx/snippets/auth_limit_judge.conf;

    location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            proxy_pass http://$judge_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        # موتور قاضی هوشمند (FastAPI/Python) — پورت 8000
        # مسیر عمومی یکپارچه `/api/v1/apps/judge/` (تحلیل، اعاده دادرسی،
        # محاسبه خسارت، تبدیل گفتار به متن و ...).
        # ------------------------------------------------------------------
        
        

    location /api/v1/apps/judge/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            proxy_pass http://$judge_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ارتقای اتصال برای وب‌سوکت مکالمهٔ صوتی زنده (/live-voice)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        # مسیر هم‌مبدأ چت‌بات برای فراخوانی موتور قاضی. درخواست‌های مرورگر
        # به `/api/judge/...` مستقیماً به موتور پایتون هدایت می‌شوند تا هیچ
        # وابستگی به لایه NestJS یا CORS وجود نداشته باشد.
        # ------------------------------------------------------------------
        
        

    location /api/judge/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            rewrite ^/api/judge/(.*)$ /api/v1/apps/judge/$1 break;
            proxy_pass http://$judge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # دارایی‌های استاتیک مشترک موتور (لوگو، نمادها و ...)
        # ------------------------------------------------------------------
        
        

    location /static/ {
            proxy_pass http://$judge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1d;
        }

        # ------------------------------------------------------------------
        # فرانت‌اند چت‌بات Next.js (UI/UX Layer) — پورت 3001
        # ------------------------------------------------------------------
        
        

    location /_next/static/ {
            proxy_pass http://$frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        
        

    
    

        # Edge-cacheable public SEO pages (see snippets/edge_cache_headers.conf).
        # Same upstream and proxy settings as `location /` below.
        location ~ ^/(laws|regulations|guides)(/|$) {
            include /etc/nginx/snippets/edge_cache_headers.conf;
            add_header Content-Language fa always;
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location ~ ^/(sitemap_index\.xml|sitemap/\d+\.xml)$ {
            include /etc/nginx/snippets/edge_cache_headers.conf;
            add_header Content-Language fa always;
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout http_502 http_503;
        }


    location / {
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }

    # ==================================================================
    # SERVER BLOCK 2 — پورتال خدمات سازمانی روکسیرا (فارسی)
    # دامنه‌ها: roxira.ir / www.roxira.ir (درخواست با IP خام توسط CATCH-ALL با 444 رد می‌شود)
    # شامل: سامانه فاکتورها، محاسبه خسارت تاخیر تادیه و مستندات API.
    # ==================================================================
    server {
        listen 80;
        listen 443 ssl;

    # اولویت قطعی وب‌سوکت پیش از فرانت‌اند
    

        http2 on;
        server_name roxira.ir www.roxira.ir;
        set $judge_backend roxira_app_prod:8000;
        set $frontend_backend roxira_enterprise_frontend:3001;
        set $enterprise_backend roxira_enterprise_backend:3000;

        # factory dispatcher intentionally not exposed (issue: security review #126)


        # درگاه وب ارسال خودکار پروژه‌ها به کارخانه ایجنت‌ها
        


        location /crm-service/ {
            limit_req zone=api burst=100 nodelay;
            limit_req_status 429;
            proxy_pass http://twenty_crm_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /crm-service;
        }


        include /etc/nginx/snippets/security_headers.conf;
        include /etc/nginx/snippets/umami.conf;


        ssl_certificate     /etc/letsencrypt/live/roxira.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/roxira.ir/privkey.pem;

        add_header Content-Language fa always;

        
        

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

        # ------------------------------------------------------------------
        # بک‌اند NestJS (Enterprise App Layer) — پورت 3000
        # توجه: NestJS با VersioningType.URI و defaultVersion='1' پیکربندی
        # شده است؛ مسیرهای واقعی کنترلر زیر پیشوند /v1/ قرار دارند و در
        # پروکسی به‌صورت خودکار افزوده می‌شوند.
        # ------------------------------------------------------------------
        
        

    include /etc/nginx/snippets/auth_limit_nest.conf;
    include /etc/nginx/snippets/auth_limit_frontend.conf;

    location = /api/v1/pricing/upgrade-inquiry {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Huge import fallback (docs/ops/HUGE_IMPORT.md): one 64 MiB part relayed by the API to R2 when the browser
    # cannot reach R2. The body is STREAMED (proxy_request_buffering off): nothing is spooled to srv1's disk.
    # 98m stays under Cloudflare's 100 MB request cap and above IMPORT_PART_BYTES (default 64 MiB).
    # The regex wins over the generic /api/backend/ prefix below. Rate limit: parts are few and large.
    location ~ "^/api/backend/enterprise-hub/data-import/bulk/uploads/[0-9a-fA-F-]{36}/parts/[0-9]+$" {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 98m;
            client_body_timeout 120s;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            rewrite ^/api/backend/(.*)$ /v1/$1 break;
            proxy_pass http://$enterprise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    location /api/backend/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            # proxy_pass با متغیر + URI مسیر را حذف می‌کند؛ پس rewrite + proxy_pass بدون URI.
            rewrite ^/api/backend/(.*)$ /v1/$1 break;
            proxy_pass http://$enterprise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        
        

    # database-package import: SQLite/.sql/.zip up to 40 MB
    # (see modules/data_import/constants/package-import.constants.ts); allow 41m here.
    # Longest-prefix match makes this win over the generic /enterprise-hub/ block below.
    location /enterprise-hub/data-import/packages {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            client_max_body_size 41m;
            rewrite ^/enterprise-hub/(.*)$ /v1/enterprise-hub/$1 break;
            proxy_pass http://$enterprise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    # NOTE(security): since #546 this location rewrites to /v1/enterprise-hub/<rest>,
    # so every /enterprise-hub/* path now reaches NestJS. Modules without an auth
    # guard (audit finding 4) are reachable until the global APP_GUARD PR lands.
    location /enterprise-hub/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            # data-import uploads: XLSX/CSV ≤10m and PDF/image ≤15m (see
            # modules/data_import/constants/data-import.constants.ts); allow 16m here.
            client_max_body_size 16m;
            rewrite ^/enterprise-hub/(.*)$ /v1/enterprise-hub/$1 break;
            proxy_pass http://$enterprise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # مستندات API (Swagger) پورتال سازمانی
        
        

    include /etc/nginx/snippets/block_docs.conf;
    include /etc/nginx/snippets/block_dotfiles.conf;

        # ------------------------------------------------------------------
        # فرانت‌اند پورتال سازمانی Next.js — ریشه و استاتیک — پورت 3001
        # ------------------------------------------------------------------
        
        

    location /_next/static/ {
            proxy_pass http://$frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        
        

    
    

    
    # روت اختصاصی وب‌سوکت با اولویت قطعی (^~) به سمت هسته پایتون
    

    
        # روت با اولویت قطعی (^~) به سمت هسته پردازش هوش مصنوعی حقوقی
        location ^~ /api/v1/apps/judge/live-voice {
            proxy_pass http://$judge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Edge-cacheable public SEO pages (see snippets/edge_cache_headers.conf).
        # Same upstream and proxy settings as `location /` below.
        location ~ ^/(laws|regulations|guides)(/|$) {
            include /etc/nginx/snippets/edge_cache_headers.conf;
            add_header Content-Language fa always;
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(sitemap_index\.xml|sitemap/\d+\.xml)$ {
            include /etc/nginx/snippets/edge_cache_headers.conf;
            add_header Content-Language fa always;
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location / {
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==================================================================
    # SERVER BLOCK 3 — Roxira International B2B Hub (English)
    # دامنه‌ها: roxira.net / www.roxira.net
    # تجربه انگلیسی‌زبان برای مخاطبان بین‌المللی: معرفی ماژول‌های سازمانی،
    # مستندات Swagger و اتصال ارزی/چندارزی. ریشه به مسیر `/en` هدایت
    # می‌شود (Next.js middleware) و API/مستندات روی همین دامنه سرو می‌شود.
    # ==================================================================
    server {
        listen 80;
        listen 443 ssl;

    # اولویت قطعی وب‌سوکت پیش از فرانت‌اند
    

        http2 on;
        server_name roxira.net www.roxira.net;
        set $judge_backend roxira_app_prod:8000;
        set $frontend_backend roxira_enterprise_frontend:3001;
        set $enterprise_backend roxira_enterprise_backend:3000;

        include /etc/nginx/snippets/security_headers.conf;
        include /etc/nginx/snippets/umami.conf;


        ssl_certificate     /etc/letsencrypt/live/roxira.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/roxira.net/privkey.pem;

        add_header Content-Language en always;

        
        

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

        # ------------------------------------------------------------------
        # Enterprise App Layer (NestJS) — API برای شرکای بین‌المللی
        # ------------------------------------------------------------------
        
        

    include /etc/nginx/snippets/auth_limit_nest.conf;
    include /etc/nginx/snippets/auth_limit_frontend.conf;

    location = /api/v1/pricing/upgrade-inquiry {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Huge import fallback (docs/ops/HUGE_IMPORT.md): one 64 MiB part relayed by the API to R2 when the browser
    # cannot reach R2. The body is STREAMED (proxy_request_buffering off): nothing is spooled to srv1's disk.
    # 98m stays under Cloudflare's 100 MB request cap and above IMPORT_PART_BYTES (default 64 MiB).
    # The regex wins over the generic /api/backend/ prefix below. Rate limit: parts are few and large.
    location ~ "^/api/backend/enterprise-hub/data-import/bulk/uploads/[0-9a-fA-F-]{36}/parts/[0-9]+$" {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 98m;
            client_body_timeout 120s;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            rewrite ^/api/backend/(.*)$ /v1/$1 break;
            proxy_pass http://$enterprise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    location /api/backend/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            # proxy_pass با متغیر + URI مسیر را حذف می‌کند؛ پس rewrite + proxy_pass بدون URI.
            rewrite ^/api/backend/(.*)$ /v1/$1 break;
            proxy_pass http://$enterprise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        
        

    # database-package import: SQLite/.sql/.zip up to 40 MB
    # (see modules/data_import/constants/package-import.constants.ts); allow 41m here.
    # Longest-prefix match makes this win over the generic /enterprise-hub/ block below.
    location /enterprise-hub/data-import/packages {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            client_max_body_size 41m;
            rewrite ^/enterprise-hub/(.*)$ /v1/enterprise-hub/$1 break;
            proxy_pass http://$enterprise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    # NOTE(security): since #546 this location rewrites to /v1/enterprise-hub/<rest>,
    # so every /enterprise-hub/* path now reaches NestJS. Modules without an auth
    # guard (audit finding 4) are reachable until the global APP_GUARD PR lands.
    location /enterprise-hub/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            # data-import uploads: XLSX/CSV ≤10m and PDF/image ≤15m (see
            # modules/data_import/constants/data-import.constants.ts); allow 16m here.
            client_max_body_size 16m;
            rewrite ^/enterprise-hub/(.*)$ /v1/enterprise-hub/$1 break;
            proxy_pass http://$enterprise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # مستندات API (Swagger/OpenAPI) قابل استفاده برای یکپارچه‌سازی شرکا
        
        

    include /etc/nginx/snippets/block_docs.conf;
    include /etc/nginx/snippets/block_dotfiles.conf;

        # ------------------------------------------------------------------
        # Next.js frontend — English international portal at /
        # ------------------------------------------------------------------
        
        

    location /_next/static/ {
            proxy_pass http://$frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        
        

    
    

    
    # روت اختصاصی وب‌سوکت با اولویت قطعی (^~) به سمت هسته پایتون
    

    
        # روت با اولویت قطعی (^~) به سمت هسته پردازش هوش مصنوعی حقوقی
        location ^~ /api/v1/apps/judge/live-voice {
            proxy_pass http://$judge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Edge-cacheable public SEO pages (see snippets/edge_cache_headers.conf).
        # Same upstream and proxy settings as `location /` below.
        location ~ ^/(laws|regulations|guides)(/|$) {
            include /etc/nginx/snippets/edge_cache_headers.conf;
            add_header Content-Language en always;
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(sitemap_index\.xml|sitemap/\d+\.xml)$ {
            include /etc/nginx/snippets/edge_cache_headers.conf;
            add_header Content-Language en always;
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location / {
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}