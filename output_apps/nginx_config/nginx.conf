events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # پرتال سامانه قاضی هوشمند
    server {
        listen 80;
        server_name ghazihoushmand.ir www.ghazihoushmand.ir;

        location / {
            proxy_pass http://roxira_app_prod:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # پرتال سازمانی روکسیرا
    server {
        listen 80 default_server;
        server_name roxira.net www.roxira.net roxira.ir www.roxira.ir 5.75.200.67;

        location / {
            proxy_pass http://roxira_app_prod:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
