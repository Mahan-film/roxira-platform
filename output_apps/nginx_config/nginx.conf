events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 50M;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # ------------------------------------------------------------------
    # پیکربندی SSL/TLS مشترک — گواهی‌های Let's Encrypt (Certbot)
    # برای دامنه‌های قاضی هوشمند و پورتال سازمانی روکسیرا
    # ------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # نقشه‌ی هدرهای Upgrade/Connection برای پشتیبانی از WebSocket/HMR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==================================================================
    # SERVER BLOCK 1 — سامانه قاضی هوشمند (Chat-First Legal Assistant)
    # دامنه‌ها: ghazihoushmand.ir / www.ghazihoushmand.ir
    # مسیر ریشه = رابط چت‌بات حقوقی؛ موتور هوش مصنوعی پایتون (AI Core).
    # ==================================================================
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name ghazihoushmand.ir www.ghazihoushmand.ir;

        ssl_certificate     /etc/letsencrypt/live/ghazihoushmand.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ghazihoushmand.ir/privkey.pem;

        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        # ------------------------------------------------------------------
        # موتور قاضی هوشمند (FastAPI/Python) — پورت 8000
        # مسیر عمومی یکپارچه `/api/v1/apps/judge/` (تحلیل، اعاده دادرسی،
        # محاسبه خسارت، تبدیل گفتار به متن و ...).
        # ------------------------------------------------------------------
        location /api/v1/apps/judge/ {
            proxy_pass http://roxira_app_prod:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # مسیر هم‌مبدأ چت‌بات برای فراخوانی موتور قاضی. درخواست‌های مرورگر
        # به `/api/judge/...` مستقیماً به موتور پایتون هدایت می‌شوند تا هیچ
        # وابستگی به لایه NestJS یا CORS وجود نداشته باشد.
        # ------------------------------------------------------------------
        location /api/judge/ {
            proxy_pass http://roxira_app_prod:8000/api/v1/apps/judge/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # دارایی‌های استاتیک مشترک موتور (لوگو، نمادها و ...)
        # ------------------------------------------------------------------
        location /static/ {
            proxy_pass http://roxira_app_prod:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1d;
        }

        # ------------------------------------------------------------------
        # فرانت‌اند چت‌بات Next.js (UI/UX Layer) — پورت 3001
        # ------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://roxira_enterprise_frontend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://roxira_enterprise_frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==================================================================
    # SERVER BLOCK 2 — پورتال خدمات سازمانی روکسیرا
    # دامنه‌ها: roxira.ir / www.roxira.ir / roxira.net / www.roxira.net
    #           و آدرس IP سرور 5.75.200.67 (default_server)
    # شامل: سامانه فاکتورها، محاسبه خسارت تاخیر تادیه و مستندات API.
    # ==================================================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name roxira.ir www.roxira.ir roxira.net www.roxira.net 5.75.200.67 localhost 127.0.0.1;

        ssl_certificate     /etc/letsencrypt/live/roxira.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/roxira.ir/privkey.pem;

        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        # ------------------------------------------------------------------
        # بک‌اند NestJS (Enterprise App Layer) — پورت 3000
        # توجه: NestJS با VersioningType.URI و defaultVersion='1' پیکربندی
        # شده است؛ مسیرهای واقعی کنترلر زیر پیشوند /v1/ قرار دارند و در
        # پروکسی به‌صورت خودکار افزوده می‌شوند.
        # ------------------------------------------------------------------
        location /api/backend/ {
            proxy_pass http://roxira_enterprise_backend:3000/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /enterprise-hub/ {
            proxy_pass http://roxira_enterprise_backend:3000/v1/enterprise-hub/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # مستندات API (Swagger) پورتال سازمانی
        location /docs {
            proxy_pass http://roxira_enterprise_backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # فرانت‌اند پورتال سازمانی Next.js — ریشه و استاتیک — پورت 3001
        # ------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://roxira_enterprise_frontend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://roxira_enterprise_frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
