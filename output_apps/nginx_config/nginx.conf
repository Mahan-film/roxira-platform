events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 50M;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # نقشه‌ی هدرهای Upgrade/Connection برای پشتیبانی از WebSocket/HMR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name ghazihoushmand.ir www.ghazihoushmand.ir roxira.net www.roxira.net roxira.ir www.roxira.ir 5.75.200.67 localhost 127.0.0.1;

        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        # ------------------------------------------------------------------
        # موتور هوش مصنوعی پایتون (SmartJudge / AI Core Layer) — پورت 8000
        # ------------------------------------------------------------------
        location /api/v1/apps/judge/ {
            proxy_pass http://roxira_app_prod:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # بک‌اند NestJS (Enterprise App Layer) — پورت 3000
        # توجه: NestJS با VersioningType.URI و defaultVersion='1' پیکربندی
        # شده است، بنابراین مسیرهای کنترلر واقعی زیر پیشوند /v1/ هستند
        # (مثال: /v1/enterprise-hub/damages) و در پروکسی باید این پیشوند
        # به‌صورت خودکار افزوده شود.
        # ------------------------------------------------------------------
        location /api/backend/ {
            proxy_pass http://roxira_enterprise_backend:3000/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /enterprise-hub/ {
            proxy_pass http://roxira_enterprise_backend:3000/v1/enterprise-hub/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://roxira_enterprise_backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # فرانت‌اند Next.js (UI/UX Layer) — ریشه و استاتیک — پورت 3001
        # ------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://roxira_enterprise_frontend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://roxira_enterprise_frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
