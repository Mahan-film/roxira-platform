
server {
    listen 80;
    server_name ghazihoushmand.ir www.ghazihoushmand.ir;

    # پروکسی مستقیم APIهای احراز هویت و هوش مصنوعی به پورت ۸۰۰۰
    location /api/ {
        proxy_pass http://roxira_app_prod:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # وب‌سوکت چت صوتی زنده
    location /api/v1/apps/judge/live-voice {
        proxy_pass http://roxira_app_prod:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # فرانت‌اند چت قضایی Next.js (پورت ۳۰۰۱)
    location / {
        proxy_pass http://roxira_enterprise_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name roxira.ir www.roxira.ir roxira.net www.roxira.net roxirad.ir roxirad.net;

    location /api/ {
        proxy_pass http://roxira_enterprise_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://roxira_enterprise_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
