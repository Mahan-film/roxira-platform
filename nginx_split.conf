
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ghazihoushmand.ir www.ghazihoushmand.ir 5.75.200.67 _;

    # ارسال اجباری و ۱۰۰٪ هدر ارجاع دامنه به سرور اینماد
    add_header Referrer-Policy "unsafe-url" always;

    location ~* ^/(api|health|docs|openapi.json) {
        proxy_pass http://roxira_app_prod:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/v1/apps/judge/live-voice {
        proxy_pass http://roxira_app_prod:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://roxira_enterprise_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}

server {
    listen 80;
    server_name roxira.ir www.roxira.ir roxira.net www.roxira.net roxirad.ir roxirad.net;

    location /api/ {
        proxy_pass http://roxira_enterprise_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://roxira_enterprise_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
