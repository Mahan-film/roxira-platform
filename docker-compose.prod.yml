services:
  enterprise_app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: roxira_app_prod
    restart: always
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./output_apps:/app/output_apps
      - ./run_unified_server.py:/app/run_unified_server.py
      - ./data:/opt/roxira_platform/data
    environment:
      - POSTGRES_HOST=postgres_prod
      - POSTGRES_PORT=5432
      - POSTGRES_USER=enterprise_admin
      - POSTGRES_PASSWORD=REDACTED_SECRET_19
      - POSTGRES_DB=enterprise_db
      - REDIS_HOST=redis_prod
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant_prod
      - QDRANT_PORT=6333
      # sms.ir (Fast/Verify) — سرویس ارسال کد تأیید (از .env مقداردهی می‌شود)
      - SMS_IR_API_KEY=${SMS_IR_API_KEY:-REDACTED_SECRET_04}
      - SMS_IR_TEMPLATE_ID=${SMS_IR_TEMPLATE_ID:-000000}
      # Kavenegar (Verify Lookup) — مسیر رسمی ارسال OTP خطوط ghazi-verify / roxira-verify
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-REDACTED_SECRET_01}
      - KAVENEGAR_TEMPLATE_GHAZI=${KAVENEGAR_TEMPLATE_GHAZI:-ghazi-verify}
      - KAVENEGAR_TEMPLATE_ROXIRA=${KAVENEGAR_TEMPLATE_ROXIRA:-roxira-verify}
      # Google OAuth 2.0 (ورود مستقیم با حساب گوگل)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # امنیت توکن JWT
      - JWT_SECRET=${JWT_SECRET:-roxira_enterprise_super_secure_jwt_secret_key_2026}
    depends_on:
      - postgres_prod
      - redis_prod
      - qdrant_prod
    networks:
      - roxira_net

  postgres_prod:
    image: postgres:17-alpine
    container_name: roxira_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: enterprise_admin
      POSTGRES_PASSWORD: REDACTED_SECRET_19
      POSTGRES_DB: enterprise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - roxira_net

  redis_prod:
    image: redis:7-alpine
    container_name: roxira_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - roxira_net

  qdrant_prod:
    image: qdrant/qdrant:latest
    container_name: roxira_qdrant_prod
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - roxira_net

  nginx_gateway:
    image: nginx:alpine
    container_name: roxira_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./production_bundle/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_web:/var/www/certbot
    depends_on:
      - enterprise_app
    networks:
      - roxira_net

networks:
  roxira_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  certbot_web:
