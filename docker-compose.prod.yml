services:
  enterprise_app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: roxira_app_prod
    restart: always
    mem_limit: 1200m
    mem_reservation: 600m
    security_opt:
      - no-new-privileges:true
    # FastAPI AI Core (پورت ۸۰۰۰) فقط روی loopback هاست منتشر می‌شود تا
    # پایش سلامت هاست/کرون کار کند؛ دسترسی عمومی از طریق nginx انجام می‌شود.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./output_apps:/app/output_apps
      - ./run_unified_server.py:/app/run_unified_server.py
      - ./data:/opt/roxira_platform/data
      # --- Owner admin console (docs/ops/ADMIN_CONSOLE.md). Host paths are mounted at the SAME path inside
      # the container, so a path that taskq.py stores in its database is valid for the host worker too.
      # Read-only (:ro) unless marked RW. The Docker socket is NOT mounted (see docker-socket-proxy below).
      # tab 5/6: the existing engines' own code, so the console uses their real state machines
      - ./scripts/marketing:/app/scripts/marketing:ro
      - ./scripts/infra/server_agents:/app/scripts/infra/server_agents:ro
      # tab 4: tier -> group fallback chains (env-var names only, no keys inside)
      - ./config/key_pool.yaml:/app/config/key_pool.yaml:ro
      - ./config/models.yaml:/app/config/models.yaml:ro
      # tab 1/4: LLM cost + latency log written by the key-pool gateway (no prompts in it)
      - /var/log/roxira-keypool:/var/log/roxira-keypool:ro
      # tab 4: model bake-off reports (*.md)
      - /var/lib/roxira-eval/bakeoff:/var/lib/roxira-eval/bakeoff:ro
      # tab 7: autodeploy-last.json (last deploy) and the host timer/disk snapshot
      - /root/deploy-state:/root/deploy-state:ro
      - /var/lib/roxira-admin:/var/lib/roxira-admin:ro
      # tab 5 (RW): taskq.db + admin-tasks/ - the console queues tasks through `taskq.py add`
      - /var/lib/roxira-agents:/var/lib/roxira-agents
      # tab 6 (RW): marketing.db - approve/reject posts with mkt_store's state machine
      - /var/lib/roxira-marketing:/var/lib/roxira-marketing
    environment:
      - ROXIRA_AUTH_DB_URL=sqlite+aiosqlite:////data/roxira_auth.db
      - POSTGRES_HOST=roxira_pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=enterprise_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=enterprise_db
      - REDIS_HOST=redis_prod
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant_prod
      - QDRANT_PORT=6333
      # Optional read-only Qdrant Cloud replica, used only when local Qdrant is unreachable
      # (docs/infra/CLOUD_ACCOUNTS_PLAN.md). Empty = off.
      - QDRANT_CLOUD_URL=${QDRANT_CLOUD_URL:-}
      - QDRANT_CLOUD_API_KEY=${QDRANT_CLOUD_API_KEY:-}
      # سرویس مشترک embedding (TEI / BAAI/bge-m3) — یک نسخه برای اپ و اسکریپت‌های ساخت
      - EMBEDDING_URL=http://roxira_embeddings:80
      # Kavenegar (Verify Lookup) — مسیر رسمی ارسال OTP خطوط ghazi-verify / roxira-verify
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:?set KAVENEGAR_API_KEY in .env}
      - KAVENEGAR_TEMPLATE_GHAZI=${KAVENEGAR_TEMPLATE_GHAZI:-ghazi-verify}
      - KAVENEGAR_TEMPLATE_ROXIRA=${KAVENEGAR_TEMPLATE_ROXIRA:-roxira-verify}
      # OpenRouter API Key — موتور دادرسی، استنتاج هوش مصنوعی و پیاده‌سازی صوت
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      # Free-first LLM key-pool gateway (AGENTS.md section 4, 2026-10-14). An
      # empty base URL keeps today's direct-OpenRouter behaviour; when set,
      # chat/answer calls go to the LiteLLM gateway with KEYPOOL_MASTER_KEY as
      # the OpenAI api key and the group model below (free models first, paid
      # DeepSeek fallback). The gateway container resolves on roxira-keypool_default.
      - SMARTJUDGE_LLM_GATEWAY=${SMARTJUDGE_LLM_GATEWAY:-}
      - SMARTJUDGE_LLM_GATEWAY_MODEL=${SMARTJUDGE_LLM_GATEWAY_MODEL:-agent-strong-free}
      - KEYPOOL_MASTER_KEY=${KEYPOOL_MASTER_KEY:-}
      # Kira AI — موتور استدلال سنگین قضایی و Fallback Engine بدون هزینه
      - KIRA_BASE_URL=${KIRA_BASE_URL:-https://kiraai.vn/api/v1}
      - KIRA_API_KEY=${KIRA_API_KEY:?set KIRA_API_KEY in .env}
      - KIRA_REASONING_MODEL=${KIRA_REASONING_MODEL:-glm-5.3-free}
      - KIRA_FALLBACK_MODEL=${KIRA_FALLBACK_MODEL:-kira-mini-1.0}
      # Google OAuth 2.0 (ورود مستقیم با حساب گوگل)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # امنیت توکن JWT
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - JWT_TTL_SECONDS=${JWT_TTL_SECONDS:-}
      - VIP_PHONE_ALLOWLIST=${VIP_PHONE_ALLOWLIST:-}
    depends_on:
      postgres_prod:
        condition: service_started
      redis_prod:
        condition: service_started
      qdrant_prod:
        condition: service_started
      pgbouncer_prod:
        condition: service_started
      roxira_embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net
      - keypool

  postgres_prod:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: roxira_postgres_prod
    restart: always
    mem_limit: 1024m
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: enterprise_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: enterprise_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_admin -d enterprise_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net

  # ------------------------------------------------------------------
  # PgBouncer — تجمیع اتصالات PostgreSQL برای بارهای ۲۰٬۰۰۰ کاربر
  # POOL_MODE=transaction و MAX_CLIENT_CONN=10000؛ بک‌اندها به 6432 وصل
  # می‌شوند تا تعداد اتصال واقعی به Postgres کنترل شود.
  # ------------------------------------------------------------------
  pgbouncer_prod:
    # pinned 2026-10-14 to the running digest; bump deliberately
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    container_name: roxira_pgbouncer
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    security_opt:
      - no-new-privileges:true
    environment:
      - DB_HOST=postgres_prod
      - DB_PORT=5432
      - DB_USER=enterprise_admin
      - DB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - DB_NAME=enterprise_db
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=200
      - MAX_DB_CONNECTIONS=500
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,options
    ports:
      - "127.0.0.1:6432:6432"
    ulimits:
      nofile:
        soft: 20000
        hard: 524288
    depends_on:
      postgres_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U enterprise_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net

  redis_prod:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: roxira_redis_prod
    restart: always
    mem_limit: 256m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net

  qdrant_prod:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: roxira_qdrant_prod
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant ships no curl/wget; a bash /dev/tcp probe confirms the
      # HTTP port accepts connections (qdrant image includes bash).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net

  # سرویس مشترک embedding (HuggingFace TEI) — اپ و اسکریپت‌های ساخت قوانین
  # بردارهای BAAI/bge-m3 را از این‌جا می‌گیرند و دیگر نسخهٔ محلی ۲.۴ گیگابایتی
  # را بار نمی‌کنند. فقط داخل roxira_net در دسترس است (بدون پورت روی هاست).
  roxira_embeddings:
    # cpu-arm64-1.9, pinned 2026-10-14
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:798cd7615e060a72ccbdf19aa0ada52289c6a0147490195bafaece6ce04d70f1
    container_name: roxira_embeddings
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: --model-id BAAI/bge-m3 --max-batch-tokens 2048 --max-client-batch-size 16 --max-concurrent-requests 8
    volumes:
      - /var/lib/roxira/tei-cache:/data
    mem_limit: 3500m
    mem_reservation: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net

  roxira_enterprise_backend:
    build:
      context: ./output_apps/enterprise_hub
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: roxira_enterprise_backend
    restart: always
    mem_limit: 900m
    mem_reservation: 450m
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=roxira_pgbouncer
      - DATABASE_PORT=6432
      # Restricted role once APP_DB_USER/APP_DB_PASSWORD are in .env (docs/ops/APP_DB_ROLE.md).
      - DATABASE_USER=${APP_DB_USER:-enterprise_admin}
      - DATABASE_PASSWORD=${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      - DATABASE_NAME=enterprise_db
      # env_file hands the container all of .env; keep the superuser password out of it.
      - POSTGRES_PASSWORD=
      - REDIS_HOST=redis_prod
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      # Kavenegar (Verify Lookup) — مسیر رسمی ارسال OTP خطوط ghazi-verify / roxira-verify
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:?set KAVENEGAR_API_KEY in .env}
      - KAVENEGAR_TEMPLATE_GHAZI=${KAVENEGAR_TEMPLATE_GHAZI:-ghazi-verify}
      - KAVENEGAR_TEMPLATE_ROXIRA=${KAVENEGAR_TEMPLATE_ROXIRA:-roxira-verify}
      # WebAuthn / Passkey — ورود بیومتریک و سخت‌افزاری
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-roxira.net}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Roxira International}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-https://roxira.net,https://www.roxira.net,http://localhost:3001}
      # System Health — فقط از طریق docker-socket-proxy (GET /containers/* ؛ بدون POST).
      # سوکت خام Docker دیگر داخل این کانتینر mount نمی‌شود (audit finding 5).
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # Tech Radar — ریشه پروژه برای اجرای زنده اسکریپت‌های پایتونی و خواندن گزارش‌ها
      - RADAR_PROJECT_ROOT=/opt/roxira_platform
      - PYTHON_BIN=python3
      - PYTHONPATH=/opt/roxira_platform
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/tmp
      # Bulk import spills (XLSX shared strings, nested workbooks) go to disk, not to the RAM-backed /tmp.
      - IMPORT_BULK_SPOOL_DIR=/import-spool
    # non-root (nestjs = uid 100 / gid 101 in the image), no capabilities,
    # read-only root filesystem. Host prerequisite for the radar write paths below:
    #   chown 100:101 TECH_RADAR_REPORT.md TECH_RADAR_REPORT.json; install -d -o 100 -g 101 data/tech_radar
    user: "100:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # ریشه پروژه فقط‌خواندنی؛ فقط مسیرهایی که رادار باید بنویسد rw هستند.
      - ./:/opt/roxira_platform:ro
      - ./TECH_RADAR_REPORT.md:/opt/roxira_platform/TECH_RADAR_REPORT.md
      - ./TECH_RADAR_REPORT.json:/opt/roxira_platform/TECH_RADAR_REPORT.json
      - ./data/tech_radar:/opt/roxira_platform/data/tech_radar
      # Host prerequisite: install -d -o 100 -g 101 /var/lib/roxira/import-spool (docs/BULK_IMPORT.md)
      - /var/lib/roxira/import-spool:/import-spool
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres_prod
      - redis_prod
      - pgbouncer_prod
      - docker-socket-proxy
    # Healthcheck comes from output_apps/enterprise_hub/Dockerfile (curl /docs);
    # not redefined here so it stays in sync with the image.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net
      - docker_proxy_net

  # ------------------------------------------------------------------
  # Read-only Docker API proxy for the System Health endpoint. Only
  # GET /containers/* is allowed; every write verb is blocked (POST=0), so a
  # compromised backend can no longer start privileged containers.
  # Reachable only from docker_proxy_net (internal: no host ports, no egress).
  # ------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: roxira_docker_socket_proxy
    restart: always
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      CONTAINERS: 1
      POST: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PING: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VERSION: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - docker_proxy_net

  roxira_enterprise_frontend:
    build:
      context: ./output_apps/enterprise_hub/frontend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID_GHAZI: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID_GHAZI:-}
        NEST_API_ORIGIN: http://roxira_enterprise_backend:3000
        JUDGE_API_ORIGIN: http://roxira_app_prod:8000
    container_name: roxira_enterprise_frontend
    restart: always
    mem_limit: 600m
    mem_reservation: 300m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEST_API_ORIGIN=http://roxira_enterprise_backend:3000
      - LEAD_NOTIFY_EMAIL=${LEAD_NOTIFY_EMAIL:-}
      - JUDGE_API_ORIGIN=http://roxira_app_prod:8000
      - SANDBOX_JWT_SECRET=${SANDBOX_JWT_SECRET:-}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - roxira_enterprise_backend
    # Healthcheck comes from output_apps/enterprise_hub/frontend/Dockerfile
    # (curl /); not redefined here so it stays in sync with the image.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net

  nginx_gateway:
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    container_name: roxira_nginx_prod
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./output_apps/nginx_config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./output_apps/nginx_config/snippets:/etc/nginx/snippets:ro
      # Cloudflare real-IP: committed baseline + generated/ (update_cloudflare_ips.sh)
      - ./nginx/cloudflare_params.conf:/etc/nginx/cloudflare/cloudflare_params.conf:ro
      - ./nginx/generated:/etc/nginx/cloudflare/generated:ro
      # self-signed cert for the catch-all default_server (gen_snakeoil_cert.sh)
      - ./nginx/ssl-default:/etc/nginx/ssl-default:ro
      # vhostهای سندباکسهای خودکار (Software Foundry) — ephemeral_runner.py
      # فایلها را روی هاست در /opt/roxira_platform/nginx/sandboxes میسازد و
      # این مانت آنها را در دسترس nginx -t / nginx -s reload قرار میدهد.
      - /opt/roxira_platform/nginx/sandboxes:/opt/roxira_platform/nginx/sandboxes:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_web:/var/www/certbot
    # مسیر رسیدن nginx به پورت منتشرشدهٔ سندباکسها در حالت bridge:
    # با تنظیم ROXIRA_NGINX_UPSTREAM_HOST=host.docker.internal این نام
    # به IP میزبان گره میخورد. 127.0.0.1 (پیشفرض) فقط وقتی درست است که
    # nginx روی network_mode: host اجرا شود.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - enterprise_app
      - roxira_enterprise_backend
      - roxira_enterprise_frontend
    healthcheck:
      # curl (not busybox wget) ships in nginx:alpine. No -f: a 502 from a
      # down upstream still proves nginx itself answers; only a refused/timed
      # out connection should flip this unhealthy.
      # Probes the container-loopback listener (127.0.0.1:8081): the public :80
      # default_server now answers 444 to anything but real hostnames.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8081/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - roxira_net

networks:
  roxira_net:
    driver: bridge
  # backend <-> docker-socket-proxy only; internal = no published ports, no egress
  docker_proxy_net:
    driver: bridge
    internal: true
  # Default bridge of the key-pool compose project (`-p roxira-keypool` in
  # scripts/infra/key_pool/install.sh); container `roxira_keypool` resolves here.
  keypool:
    external: true
    name: roxira-keypool_default

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  certbot_web:
