services:
  enterprise_app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: roxira_app_prod
    restart: always
    # FastAPI AI Core (پورت ۸۰۰۰) فقط روی loopback هاست منتشر می‌شود تا
    # پایش سلامت هاست/کرون کار کند؛ دسترسی عمومی از طریق nginx انجام می‌شود.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./src:/app/src
      - ./output_apps:/app/output_apps
      - ./run_unified_server.py:/app/run_unified_server.py
      - ./data:/opt/roxira_platform/data
    environment:
      - ROXIRA_AUTH_DB_URL=sqlite+aiosqlite:////data/roxira_auth.db
      - POSTGRES_HOST=roxira_pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=enterprise_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=enterprise_db
      - REDIS_HOST=redis_prod
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant_prod
      - QDRANT_PORT=6333
      # sms.ir (Fast/Verify) — سرویس ارسال کد تأیید (از .env مقداردهی می‌شود)
      - SMS_IR_API_KEY=${SMS_IR_API_KEY:?set SMS_IR_API_KEY in .env}
      - SMS_IR_TEMPLATE_ID=${SMS_IR_TEMPLATE_ID:-000000}
      # Kavenegar (Verify Lookup) — مسیر رسمی ارسال OTP خطوط ghazi-verify / roxira-verify
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:?set KAVENEGAR_API_KEY in .env}
      - KAVENEGAR_TEMPLATE_GHAZI=${KAVENEGAR_TEMPLATE_GHAZI:-ghazi-verify}
      - KAVENEGAR_TEMPLATE_ROXIRA=${KAVENEGAR_TEMPLATE_ROXIRA:-roxira-verify}
      # OpenRouter API Key — موتور دادرسی، استنتاج هوش مصنوعی و پیاده‌سازی صوت
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      # Kira AI — موتور استدلال سنگین قضایی و Fallback Engine بدون هزینه
      - KIRA_BASE_URL=${KIRA_BASE_URL:-https://kiraai.vn/api/v1}
      - KIRA_API_KEY=${KIRA_API_KEY:?set KIRA_API_KEY in .env}
      - KIRA_REASONING_MODEL=${KIRA_REASONING_MODEL:-glm-5.3-free}
      - KIRA_FALLBACK_MODEL=${KIRA_FALLBACK_MODEL:-kira-mini-1.0}
      # Google OAuth 2.0 (ورود مستقیم با حساب گوگل)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # امنیت توکن JWT
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      - postgres_prod
      - redis_prod
      - qdrant_prod
      - pgbouncer_prod
    networks:
      - roxira_net

  postgres_prod:
    image: postgres:17-alpine
    container_name: roxira_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: enterprise_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: enterprise_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_admin -d enterprise_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - roxira_net

  # ------------------------------------------------------------------
  # PgBouncer — تجمیع اتصالات PostgreSQL برای بارهای ۲۰٬۰۰۰ کاربر
  # POOL_MODE=transaction و MAX_CLIENT_CONN=10000؛ بک‌اندها به 6432 وصل
  # می‌شوند تا تعداد اتصال واقعی به Postgres کنترل شود.
  # ------------------------------------------------------------------
  pgbouncer_prod:
    image: edoburu/pgbouncer:latest
    container_name: roxira_pgbouncer
    restart: always
    environment:
      - DB_HOST=postgres_prod
      - DB_PORT=5432
      - DB_USER=enterprise_admin
      - DB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - DB_NAME=enterprise_db
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=200
      - MAX_DB_CONNECTIONS=500
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,options
    ports:
      - "127.0.0.1:6432:6432"
    ulimits:
      nofile:
        soft: 20000
        hard: 524288
    depends_on:
      postgres_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U enterprise_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - roxira_net

  redis_prod:
    image: redis:7-alpine
    container_name: roxira_redis_prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - roxira_net

  qdrant_prod:
    image: qdrant/qdrant:latest
    container_name: roxira_qdrant_prod
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - roxira_net

  roxira_enterprise_backend:
    build:
      context: ./output_apps/enterprise_hub
      dockerfile: Dockerfile
    container_name: roxira_enterprise_backend
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=roxira_pgbouncer
      - DATABASE_PORT=6432
      - DATABASE_USER=enterprise_admin
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - DATABASE_NAME=enterprise_db
      - REDIS_HOST=redis_prod
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      # Kavenegar (Verify Lookup) — مسیر رسمی ارسال OTP خطوط ghazi-verify / roxira-verify
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:?set KAVENEGAR_API_KEY in .env}
      - KAVENEGAR_TEMPLATE_GHAZI=${KAVENEGAR_TEMPLATE_GHAZI:-ghazi-verify}
      - KAVENEGAR_TEMPLATE_ROXIRA=${KAVENEGAR_TEMPLATE_ROXIRA:-roxira-verify}
      # WebAuthn / Passkey — ورود بیومتریک و سخت‌افزاری
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-roxira.net}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Roxira International}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-https://roxira.net,https://www.roxira.net,http://localhost:3001}
      # System Health — دسترسی read-only به Docker Engine برای پایش کانتینرها
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      # Tech Radar — ریشه پروژه برای اجرای زنده اسکریپت‌های پایتونی و خواندن گزارش‌ها
      - RADAR_PROJECT_ROOT=/opt/roxira_platform
      - PYTHON_BIN=python3
      - PYTHONPATH=/opt/roxira_platform
    volumes:
      # سوکت Docker به‌صورت read-only برای اندپوینت GET /health/system
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # ریشه پروژه جهت اجرای زنده tech_radar.py و parallel_swarm_runner.py و
      # دسترسی به TECH_RADAR_REPORT.md/.json (اندپوینت‌های رادار فناوری)
      - ./:/opt/roxira_platform
    group_add:
      # گروه سوکت Docker روی میزبان (getent group docker)
      - "${DOCKER_GID:-988}"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres_prod
      - redis_prod
      - pgbouncer_prod
    networks:
      - roxira_net

  roxira_enterprise_frontend:
    build:
      context: ./output_apps/enterprise_hub/frontend
      dockerfile: Dockerfile
      args:
        NEST_API_ORIGIN: http://roxira_enterprise_backend:3000
        JUDGE_API_ORIGIN: http://roxira_app_prod:8000
    container_name: roxira_enterprise_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEST_API_ORIGIN=http://roxira_enterprise_backend:3000
      - JUDGE_API_ORIGIN=http://roxira_app_prod:8000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - roxira_enterprise_backend
    networks:
      - roxira_net

  nginx_gateway:
    image: nginx:alpine
    container_name: roxira_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./output_apps/nginx_config/nginx.conf:/etc/nginx/nginx.conf:ro
      # vhostهای سندباکسهای خودکار (Software Foundry) — ephemeral_runner.py
      # فایلها را روی هاست در /opt/roxira_platform/nginx/sandboxes میسازد و
      # این مانت آنها را در دسترس nginx -t / nginx -s reload قرار میدهد.
      - /opt/roxira_platform/nginx/sandboxes:/opt/roxira_platform/nginx/sandboxes:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_web:/var/www/certbot
    # مسیر رسیدن nginx به پورت منتشرشدهٔ سندباکسها در حالت bridge:
    # با تنظیم ROXIRA_NGINX_UPSTREAM_HOST=host.docker.internal این نام
    # به IP میزبان گره میخورد. 127.0.0.1 (پیشفرض) فقط وقتی درست است که
    # nginx روی network_mode: host اجرا شود.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - enterprise_app
      - roxira_enterprise_backend
      - roxira_enterprise_frontend
    networks:
      - roxira_net

networks:
  roxira_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  certbot_web:
