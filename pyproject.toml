[project]
name = "project-foundry"
version = "0.1.0"
description = "Roxira OS enterprise platform and Smart Judge legal AI engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crawlee[adaptive-crawler,beautifulsoup,parsel,playwright]>=1.8.3,<2",
    "django==5.2.16",
    "django-environ>=0.14.0",
    "django-ninja>=1.6.2",
    "httpx>=0.28.1",
    "license-expression>=30.4.4",
    "mypy>=2.3.0",
    "parsel>=1.11.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
    "pytest-django>=4.13.0",
    "ruff>=0.16.2",
]
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*.py", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]
# pre-existing: undefined 'app' (issue #122); fix the file, then remove this line
"src/roxira_manager/main.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
norecursedirs = ["venv", "node_modules", ".git", "*.egg-info", "__pycache__"]
markers = [
    "integration: needs live services (Postgres, Qdrant, LLM keys, network); skipped in CI",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
]

# ── پردازش اسناد (هستهٔ SmartJudge) ──────────────────────────────────────────
# موتور اصلی تبدیل PDF/Word/تصویر به Markdown با چیدمان، جدول و OCR چندزبانه.
# در نبود آن، پکیج به‌صورت خودکار به PyMuPDF + python-docx + OCR بینایی تنزل می‌کند.
documents = [
    "docling>=2.5.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]

# ── گراف دانش حقوقی (هستهٔ SmartJudge) ──────────────────────────────────────
# موتور بازیابی دوسطحی: گراف موجودیت/رابطه + برداری با حالت ترکیبی (mix).
# در نبود آن، بازیابی به لایهٔ SQL بومی dual_retrieval تنزل می‌کند.
legal-graph = [
    "lightrag-hku>=1.4.0",
]

# ── سرور MCP رادار فناوری (W9 Phase B) ──────────────────────────────────────
# src/automation/mcp_server.py — research_project/radar_digest/compare_technologies
# را از طریق stdio به هر پروژه دیگری که Claude Code در آن باز است عرضه می‌کند.
research-mcp = [
    "mcp>=1.2.0",
]
