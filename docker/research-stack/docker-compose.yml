services:
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - 127.0.0.1:8888:8080
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng:rw
    mem_limit: 768m
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks: [research]

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save "" --appendonly no
    mem_limit: 128m
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks: [research]

networks:
  research:
    name: research
