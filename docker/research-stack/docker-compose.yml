services:
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - 127.0.0.1:8888:8080
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng:rw
    mem_limit: 768m
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks: [research]

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    # Run as non-root directly: with cap_drop ALL the image entrypoint cannot drop privileges itself.
    user: "999:999"
    command: valkey-server --save "" --appendonly no
    mem_limit: 128m
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks: [research]

  crawl4ai:
    image: unclecode/crawl4ai:0.9.4
    ports:
      - 127.0.0.1:11235:11235
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks: [research]

networks:
  research:
    name: research
