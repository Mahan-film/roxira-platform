# Roxira LLM key pool: ONE free-first, OpenAI-compatible gateway for every agent and project.
# Single source of truth for providers, key env-var NAMES, limits and model groups.
#   - scripts/infra/key_pool/render_litellm.py renders the LiteLLM proxy config from this file.
#   - scripts/dev/llm_pool.py reads the same file and calls providers directly (no gateway needed).
# NEVER put a key value here: only env var names. Model ids come from config/models.yaml
# (role/alias references below) wherever the registry has them. Provider-native ids that are NOT
# OpenRouter catalogue ids (SambaNova, Mistral, Gemini, Groq extras) cannot live in
# models.yaml (scripts/check_models.py diffs it against OpenRouter), so they are listed here
# as `id:` and every one of them is marked unverified until checked against the provider's list.
#
# Model spec forms (under a provider's `models:`):
#   {role: free, take: 2}                 first N ids of a models.yaml role
#   {role: agent_runner, alias: groq-strong}   one entry picked by its alias in models.yaml
#   {id: some-native-id}                  provider-native id (unverified)
#
# Limits are per KEY per model. `status: unverified` = written from memory of the provider's
# public docs; re-check before trusting them for capacity planning. The gateway also adapts
# at runtime: a 429 puts that deployment in cooldown and traffic moves to the next one.
#
# DATA POLICY (AGENTS.md section 4):
#   data_policy: may_log   free tiers and anything whose terms we have not confirmed. Public code,
#                          docs and dev chatter only. NEVER customer or case data.
#   data_policy: no_train  paid API terms with no training on prompts (still: send customer data
#                          only with provider.data_collection=deny, set via extra_body below).
#   Groq/SambaNova/Mistral/Gemini are conservatively marked may_log until the owner has
#   read their terms; promote one to no_train here only after that.
#
# GROUPS (the "model" name callers send to the gateway). Groups are split by MODEL TIER so a
# simple-shuffle mix of strong and weak models never happens: strong agents always get a strong
# model, light agents a cheap one. Each group may restrict which models a provider contributes
# via a `models:` map (provider name -> model specs); a provider missing from the map keeps all
# its models. `fallback:` is the ordered list of groups the router tries when the group fails.
#   agent-strong-free  strong models only (groq gpt-oss-120b, sambanova gpt-oss-120b, Gemini Flash
#                      x2, nemotron-ultra :free). Falls back to agent-free-paid.
#   agent-light-free   cheap models only (groq gpt-oss-20b, mistral-small, gemma-4 :free,
#                      nemotron-super :free, laguna :free). Falls back to agent-strong-free then paid.
#   agent-free         backward-compatible alias of agent-strong-free (same deployments).
#   agent-free-paid    paid DeepSeek Flash only; the shared last-resort fallback for the free groups.
#   private            customer/case data. `require` makes the renderer and the client REFUSE to build the
#                      group if it contains a may_log provider, a free-tier provider or a :free model id.
#                      Today that leaves only OpenRouter paid DeepSeek (+ data_collection=deny).

schema_version: 1
checked_at: "2026-10-13"

gateway:
  # LiteLLM proxy, docker, bound to 127.0.0.1 only. Port 4000 is reserved for gateways (AGENTS.md section 7).
  # Tag pinned; unverified from this machine: `install.sh --apply` runs `docker pull` and stops if it is wrong.
  image: ghcr.io/berriai/litellm:main-v1.77.7-stable
  host: 127.0.0.1
  port: 4000
  master_key_env: KEYPOOL_MASTER_KEY   # callers send it as the OpenAI api key; set with set_server_env.sh --generate
  cost_log: true                       # render_litellm adds the cost_logger callback; writes /logs/requests.jsonl
  router:
    # simple-shuffle picks among a group's deployments weighted by their rpm/tpm (from each
    # provider's `limits`), so the three Groq keys share the load. usage-based-routing-v2 was tried
    # and made every group answer "No deployments available" on this LiteLLM build: do not use it.
    routing_strategy: simple-shuffle   # usage-based-routing-v2 broke every group on this LiteLLM build (2026-10-14): "No deployments available"
    num_retries: 2
    retry_after: 1
    timeout: 60
    cooldown_time: 60                  # seconds a deployment sits out after a 429 / failure
    allowed_fails: 3
    enable_pre_call_checks: true

providers:
  groq:
    tier: free
    data_policy: may_log
    base_url: https://api.groq.com/openai/v1
    litellm_prefix: groq
    keys: [GROQ_API_KEY, GROQ_API_KEY_2, GROQ_API_KEY_3]   # every set key is its own deployment
    models:
      - {role: agent_runner, alias: groq-strong}   # openai/gpt-oss-120b
      - {role: agent_runner, alias: groq-fast}     # openai/gpt-oss-20b
    limits: {rpm: 30, tpm: 8000, rpd: 1000, status: unverified}

  sambanova:
    tier: free
    data_policy: may_log
    base_url: https://api.sambanova.ai/v1
    litellm_prefix: sambanova
    keys: [SAMBANOVA_API_KEY]
    models:
      - {id: gpt-oss-120b}   # unverified native id
    limits: {rpm: 20, tpm: 100000, rpd: unverified, status: unverified}

  mistral:
    tier: free
    data_policy: may_log   # free "Experiment" plan may train on prompts
    base_url: https://api.mistral.ai/v1
    litellm_prefix: mistral
    keys: [MISTRAL_API_KEY, MISTRAL_API_KEY_2, MISTRAL_API_KEY_3, MISTRAL_API_KEY_4]   # every set key is its own deployment
    models:   # ids verified with GET /v1/models (function_calling) on 2026-10-14
      - {id: mistral-medium-latest}
      - {id: mistral-code-latest}
      - {id: mistral-small-latest}
      - {id: ministral-8b-latest}
    limits: {rpm: 60, tpm: 500000, rpd: unverified, status: unverified}

  gemini:
    tier: free
    data_policy: may_log   # Google free tier content is used to improve products
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    litellm_prefix: gemini
    # Up to 4 AI Studio keys (owner, 2026-10-16). Keys from SEPARATE Google Cloud projects get separate
    # quotas; keys of one project share it. Missing keys are skipped at render time.
    billing: false   # set true once billing is enabled in AI Studio: Pro models then lead gemini-best
    keys: [GEMINI_API_KEY, GEMINI_API_KEY_2, GEMINI_API_KEY_3, GEMINI_API_KEY_4]
    models:
      - {id: gemini-flash-latest}   # verified 200 on 2026-10-13
      - {id: gemini-3.7-flash}      # verified 200 on 2026-10-13
    limits: {rpm: 10, tpm: 250000, rpd: 250, status: unverified}

  openrouter-free:
    tier: free
    data_policy: may_log
    base_url: https://openrouter.ai/api/v1
    litellm_prefix: openrouter
    keys_any: [OPENROUTER_API_KEY_AGENTS, OPENROUTER_API_KEY]   # first one that is set
    models:
      - {id: "google/gemma-4-31b-it:free"}
      - {id: "nvidia/nemotron-3-super-120b-a12b:free"}
      - {id: "nvidia/nemotron-3-ultra-550b-a55b:free"}
      - {id: "poolside/laguna-s-2.1:free"}
    limits: {rpm: 20, tpm: unverified, rpd: 50, status: unverified}   # rpd 50 without credit, ~1000 with $10 credit
    note: Blocked from Iranian IPs without a VPN; the Mac client skips it quickly when it fails.

  openrouter-paid:
    tier: paid
    data_policy: no_train
    base_url: https://openrouter.ai/api/v1
    litellm_prefix: openrouter
    keys_any: [OPENROUTER_API_KEY_AGENTS, OPENROUTER_API_KEY]
    models:
      - {role: cheap, take: 2}   # deepseek/deepseek-v4.1-flash, then v4-flash-0731
    limits: {rpm: 200, tpm: unverified, rpd: unlimited, status: unverified}
    extra_body:
      provider: {data_collection: deny, allow_fallbacks: true}

  openrouter-private:
    tier: paid
    data_policy: no_train
    base_url: https://openrouter.ai/api/v1
    litellm_prefix: openrouter
    keys: [OPENROUTER_API_KEY]   # prod key only; the _AGENTS workspace allows data-training endpoints
    models:
      - {role: cheap, take: 2}   # deepseek/deepseek-v4.1-flash, then v4-flash-0731
    limits: {rpm: 200, tpm: unverified, rpd: unlimited, status: unverified}
    extra_body:
      provider: {data_collection: deny, allow_fallbacks: true}

  local-tei:
    # Shared local TEI container `roxira_embeddings`, OpenAI-compatible at /v1 with BAAI/bge-m3.
    # No key at all: rendered with api_key "none" and always available. Local host => prompts
    # never leave the machine, so this is the one free provider that can be data_policy no_train.
    tier: free
    data_policy: no_train
    base_url: http://roxira_embeddings:80/v1
    api_base: http://roxira_embeddings:80/v1   # LiteLLM needs the explicit base for the openai prefix
    litellm_prefix: openai
    models:
      - {id: bge-m3, mode: embedding}

groups:
  agent-strong-free:
    description: Strong models for code, docs and dev tasks. Free providers only, paid DeepSeek Flash as last resort.
    providers: [groq, sambanova, mistral, gemini, openrouter-free]
    models:                            # restrict each provider to the strong tier
      groq: [{role: agent_runner, alias: groq-strong}]
      sambanova: [{id: gpt-oss-120b}]
      mistral: [{id: mistral-medium-latest}, {id: mistral-code-latest}]
      gemini: [{id: gemini-flash-latest}, {id: gemini-3.7-flash}]
      openrouter-free: [{id: "nvidia/nemotron-3-ultra-550b-a55b:free"}]
    fallback: [agent-free-paid]

  agent-light-free:
    description: Cheap models for light code, docs and dev tasks. Free providers only, falls back to strong then paid.
    providers: [groq, mistral, openrouter-free]
    models:
      groq: [{role: agent_runner, alias: groq-fast}]
      mistral: [{id: mistral-small-latest}, {id: ministral-8b-latest}]
      openrouter-free:
        - {id: "google/gemma-4-31b-it:free"}
        - {id: "nvidia/nemotron-3-super-120b-a12b:free"}
        - {id: "poolside/laguna-s-2.1:free"}
    fallback: [agent-strong-free, agent-free-paid]

  agent-free:   # backward-compatible alias of agent-strong-free (same deployments, same fallback)
    description: Alias of agent-strong-free kept for callers that still ask for `agent-free`.
    providers: [groq, sambanova, mistral, gemini, openrouter-free]
    models:
      groq: [{role: agent_runner, alias: groq-strong}]
      sambanova: [{id: gpt-oss-120b}]
      mistral: [{id: mistral-medium-latest}, {id: mistral-code-latest}]
      gemini: [{id: gemini-flash-latest}, {id: gemini-3.7-flash}]
      openrouter-free: [{id: "nvidia/nemotron-3-ultra-550b-a55b:free"}]
    fallback: [agent-free-paid]

  product-free:   # Smart Judge chat (owner decision 2026-10-14: free first). Only models that return a clean
                  # final answer in `content`; providers seen leaking reasoning text (sambanova gpt-oss,
                  # OpenRouter :free reasoning models) are excluded.
    description: Product chat answers. Clean-output free models first, paid DeepSeek Flash as fallback.
    providers: [groq, gemini, mistral]
    models:
      groq: [{role: agent_runner, alias: groq-strong}]
      gemini: [{id: gemini-flash-latest}, {id: gemini-3.7-flash}]
      mistral: [{id: mistral-medium-latest}]
    # Paid fallback on the PRODUCT key (private: no_train), never the $5 agents key (2026-10-15: the
    # cost log showed product chat draining OPENROUTER_API_KEY_AGENTS, which then stopped the agents).
    fallback: [private]

  gemini-best:   # owner 2026-10-16: best model first on ALL keys, then the next model on all keys, and so on.
                 # `ordered: true`: one LiteLLM group per model rank (all keys inside), chained by fallbacks.
                 # Free tier (no billing): Pro models answer 429 until billing is on, then they lead automatically.
                 # Probe 2026-10-16: argon/3.1-pro/pro-latest 429, 3.8/3.7-flash 503 (busy), 3.6/3.5/3-flash ok.
    description: Gemini ladder, best quality first across all AI Studio keys.
    ordered: true
    providers: [gemini]
    models:
      gemini:
        - {id: gemini-4-argon, needs_billing: true}          # joins the ladder when gemini.billing is true
        - {id: gemini-3.1-pro-preview, needs_billing: true}
        - {id: gemini-3.8-flash}
        - {id: gemini-3.7-flash}
        - {id: gemini-3.6-flash}
        - {id: gemini-3.5-flash}
        - {id: gemini-3-flash-preview}
        - {id: gemini-3.5-flash-lite}
        - {id: gemma-4-26b-a4b-it}
    fallback: [agent-free-paid]

  agent-free-paid:
    description: Paid DeepSeek Flash only. Shared last-resort fallback for the free agent groups.
    providers: [openrouter-paid]

  private:
    description: Customer or case data. No free tier, no may_log provider, no :free model id.
    providers: [openrouter-private]
    require:
      data_policy: no_train
      forbid_free: true
  embeddings:
    description: Embeddings only, served by the shared local TEI (BAAI/bge-m3). No external call.
    providers: [local-tei]
