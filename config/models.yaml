# Roxira model & tool registry (W12, first slice — docs/STRATEGY.md §3, row W12).
#
# Single source of truth for "which model for which job". Read by:
#   - output_apps/generated_modules/smartjudge/model_registry.py (loader), which
#     output_apps/generated_modules/smartjudge/llm_router.py and
#     src/automation/provider_base.py both import their default model lists from.
#   - scripts/check_models.py, which diffs these ids/prices against the live
#     OpenRouter catalogue and fails on a missing primary.
#   - opencode.json (repo root), whose `build`/`plan` agents take their model
#     from the `executor` role below.
#
# Every id here was checked LIVE against OpenRouter's GET /api/v1/models on
# 2026-09-25 (docs/research/TECH_CURRENCY_2026-09.md) unless a `note` says
# otherwise. Prices are USD per 1M tokens, in/out, from that same audit.
# `cheap` and `strong` (the product-runtime roles) were re-verified live
# 2026-09-28 for W24 (docs/STATE.md) -- see the notes on those two roles below.
# All price_per_1m values were re-verified LIVE against
# https://openrouter.ai/api/v1/models on 2026-09-29 (issue #103); the roles
# whose prices changed carry the updated figure in their comment below.
#
# data_policy:
#   non_sensitive_only  — free-tier / logs-or-trains-on-prompts providers.
#                          Customer case data must NEVER be routed here
#                          (docs/STRATEGY.md §3b). llm_router.py enforces this
#                          in code for the `free` role regardless of this file.
#   standard             — provider terms are the normal paid-API terms;
#                          customer case data is allowed.
#
# An env var (LLM_TIER_<ROLE>, see llm_router.py) always overrides the model
# list for a role at runtime. This file only sets the defaults.

schema_version: 1
checked_at: "2026-10-17"
source: docs/research/TECH_CURRENCY_2026-09.md

roles:
  # ---- Product runtime tiers (docs/STRATEGY.md §3b) -----------------------
  free:
    description: Non-sensitive background work — crawler summaries, SEO text, tagging, tech radar.
    data_policy: non_sensitive_only
    models:
      - id: qwen/qwen3.8-27b:free
        price_per_1m: { in: 0, out: 0 }
      - id: google/gemma-4-31b-it:free
        alias: gemma-free
        price_per_1m: { in: 0, out: 0 }
      - id: nvidia/nemotron-3-super-120b-a12b:free
        alias: nemotron-super
        price_per_1m: { in: 0, out: 0 }
      # Added 2026-10-17 (live catalogue check): strongest free model, used by the key pool's
      # free product ladder (config/key_pool.yaml best-product-free).
      - id: nvidia/nemotron-3-ultra-550b-a55b:free
        alias: nemotron-ultra
        price_per_1m: { in: 0, out: 0 }
      # Last-resort fallback: openrouter/free is OpenRouter's own auto-router id, not a
      # single named model, so it never appears in GET /api/v1/models and price/quality
      # vary per request. catalogue_listed: false makes scripts/check_models.py skip the
      # live-catalogue check for it, same as the stt role's whisper entry above.
      - id: openrouter/free
        price_per_1m: { in: 0, out: 0 }
        catalogue_listed: false
        note: >
          OpenRouter router id (auto-picks among its free-tier models), used only as the
          last fallback if every named free model above is unavailable.

  cheap:
    description: Default chat, classification, query rewriting -- every website chat
      turn, free and paid subscription plans alike (W24, docs/STATE.md).
    data_policy: standard
    models:
      # W24 owner decision (2026-09-28): DeepSeek V4.1 Flash is the mandated
      # first choice for every product chat turn (free and paid plans), not
      # just an eval candidate. Price re-checked LIVE 2026-09-29
      # (openrouter.ai/api/v1/models, issue #103): the 2026-09-28 audit's
      # "0.035/0.29 nearly tied" reading is stale -- v4.1-flash is now
      # 0.30/1.20. The owner-mandated primary is kept unchanged (this PR
      # corrects prices only; a primary swap is a separate owner decision).
      - id: deepseek/deepseek-v4.1-flash
        price_per_1m: { in: 0.036, out: 0.405, cache_read: 0.0054 }
      # Fallback if the primary is rate-limited/retired: same DeepSeek Flash
      # family. Price re-checked live 2026-09-29 (issue #103):
      # 0.018/0.32 (was 0.021/0.32 in the 2026-09-26 audit).
      - id: deepseek/deepseek-v4-flash-0731
        price_per_1m: { in: 0.018, out: 0.32 }
      - id: qwen/qwen3.8-flash
        price_per_1m: { in: 0.15, out: 0.47 }
      - id: google/gemini-3.1-flash-lite
        price_per_1m: { in: 0.25, out: 1.50 }
      # Last-resort fallback, added 2026-09-29 (issue #103). candidate: 4x
      # cheaper, pending quality eval.
      - id: deepseek/deepseek-v4-flash
        price_per_1m: { in: 0.0763, out: 0.1526 }

  strong:
    description: Final legal drafting and reasoning shown to the customer -- harder
      chat turns and legal drafts on every plan (W24). No anthropic/claude-sonnet-5
      here by owner decision (2026-09-28); Sonnet stays only in the builder
      `reviewer`/`architect` roles below, never in the product runtime.
    data_policy: standard
    models:
      # W24 owner priority order: DeepSeek V4 Pro, then GLM-5.3, then Kimi K3,
      # then Gemini 3.8 Flash as the last, cheapest-but-lowest-priority
      # fallback. Prices verified LIVE 2026-09-29 (openrouter.ai/api/v1/models,
      # issue #103): only v4-pro moved (0.955/1.911 -> 0.936294/1.872588);
      # GLM-5.3 (1.40/4.40), Kimi K3 (3.00/15.00) and Gemini 3.8 Flash
      # (0.75/3.75) were already current.
      - id: deepseek/deepseek-v4-pro
        price_per_1m: { in: 0.267, out: 0.533, cache_read: 0.022 }
      - id: z-ai/glm-5.3
        price_per_1m: { in: 0.079, out: 4.80 }
      - id: moonshotai/kimi-k3
        price_per_1m: { in: 0.304, out: 11.94 }
      - id: google/gemini-3.8-flash
        price_per_1m: { in: 0.75, out: 3.75 }

  product:
    description: >
      Smart Judge BASIC paid plan (owner 2026-10-17) -- Claude Haiku 5.5 first, then DeepSeek V4.1 Flash.
      Anthropic needs cache_control on the static prefix (set in config/key_pool.yaml); DeepSeek caches itself.
      The key pool chains this to the free ladder, so nothing stops when paid credit runs out.
    data_policy: standard
    models:
      - id: anthropic/claude-haiku-5.5
        alias: haiku
        price_per_1m: { in: 0.10, out: 0.50, cache_read: 0.01 }
      - id: deepseek/deepseek-v4.1-flash
        alias: ds-flash
        price_per_1m: { in: 0.036, out: 0.405, cache_read: 0.0054 }

  product_pro:
    description: >
      Smart Judge PRO plan (owner 2026-10-16, $10/month) -- strong paid models for subscribers'
      answers, up to SJ_PRO_TOP_DAILY per day, then the basic paid model. Order (2026-10-17): DeepSeek V4 Pro,
      Claude Haiku 5.5, GLM-5.3 last (its output is expensive).
    data_policy: standard
    models:
      - id: deepseek/deepseek-v4-pro
        alias: pro
        price_per_1m: { in: 0.267, out: 0.533, cache_read: 0.022 }
      - id: anthropic/claude-haiku-5.5
        alias: haiku
        price_per_1m: { in: 0.10, out: 0.50, cache_read: 0.01 }
      - id: z-ai/glm-5.3
        alias: glm
        price_per_1m: { in: 0.079, out: 4.80 }

  product_premium:
    description: >
      Smart Judge PREMIUM plan (owner 2026-10-16, $29/month) -- the world's best models, up to
      CHAT_PREMIUM_TOP_DAILY_LIMIT (default 8) answers per day, then product_pro. The owner asked explicitly for top models
      here, which supersedes the 2026-09-28 "no Anthropic in the product runtime" note for this plan only.
    data_policy: standard
    models:
      - id: anthropic/claude-opus-5
        alias: opus
        price_per_1m: { in: 5.0, out: 25.0, cache_read: 0.5 }
      - id: moonshotai/kimi-k3
        alias: kimi
        price_per_1m: { in: 0.304, out: 11.94 }

  cheap_agent:
    description: >
      Background / agent paid step (key pool group agent-free-paid) -- GLM-5.3 Flash first, then
      DeepSeek V4.1 Flash. Public/dev work only (agents key); both cache automatically on OpenRouter.
    data_policy: standard
    models:
      - id: z-ai/glm-5.3-flash
        alias: glm-flash
        price_per_1m: { in: 0.016, out: 0.405, cache_read: 0.011 }
      - id: deepseek/deepseek-v4.1-flash
        alias: ds-flash
        price_per_1m: { in: 0.036, out: 0.405, cache_read: 0.0054 }

  summarize:
    description: >
      Compress long uploaded case files before the main model (key pool group summarize-cheap).
      ScaleDown has a 1M context and $0 output; not wired into any app yet.
    data_policy: standard
    models:
      - id: scaledown/summarize
        alias: summarize
        price_per_1m: { in: 0.04, out: 0 }

  mimo:
    description: >
      Candidate only (not used by any group) -- Xiaomi MiMo V2.6 Flash, kept for model-eval runs.
    data_policy: standard
    models:
      - id: xiaomi/mimo-v2.6-flash
        price_per_1m: { in: 0.14, out: 0.28 }

  stt:
    description: Speech-to-text for the voice pipeline (Persian/Farsi required).
    data_policy: standard
    models:
      - id: openai/whisper-large-v3
        price_per_1m: null
        catalogue_listed: false
        note: >
          Primary since 2026-10-11 (docs/ops/VOICE_DIAGNOSIS_2026-10-11.md). This is the
          id the website mic button has used successfully in production for weeks
          (docker logs: `STT-SUCCESS-JSON openai/whisper-large-v3`, HTTP 200, ~2 s for a
          clean Persian clip, m4a and webm both accepted). Like the turbo entry below it
          is not in GET /api/v1/models (separate transcriptions endpoint), hence
          catalogue_listed: false. The live-voice socket used to start with turbo, which
          answered 429 on 2026-09-24, so every live turn paid a failed call first.
      - id: openai/whisper-large-v3-turbo
        price_per_1m: null
        catalogue_listed: false
        note: >
          Issue #39 (weekly model-registry-check, opened 2026-09-26): this id
          is absent from a fresh GET /api/v1/models fetch (zero "whisper" ids
          in the 458-model live catalogue) -- confirming the UNVERIFIED flag
          this note replaces. `catalogue_listed: false` tells
          scripts/check_models.py to skip the live-catalogue check for this
          entry (like the edge-tts: tts entry below) instead of reporting it
          MISSING, because production evidence says it is not actually gone:
          docker logs on the prod server (roxira_app_prod, 2026-09-24 22:53 UTC)
          show this id executing against OpenRouter's *separate*
          `/api/v1/audio/transcriptions` endpoint and getting back HTTP 429
          (rate-limited), not 404/model-not-found -- i.e. OpenRouter's
          dedicated transcription models are apparently just not surfaced via
          the general /api/v1/models listing at all. A live re-check
          (2026-09-26) found no successor dedicated STT/transcription id on
          OpenRouter either; the only remaining audio-capable ids are general
          multimodal chat-completion models (openai/gpt-audio,
          google/gemini-3.x-flash family, mistralai/voxtral-small-24b-2507 --
          see the fallback entry below) which need a different request shape
          (chat completions with an `input_audio` content part, not this
          endpoint's {model, input_audio, language} POST body) -- adopting
          one as the primary is a real provider-integration change, not made
          in this PR. Least-change recommendation for the owner: self-host
          `faster-whisper large-v3-turbo` (same weights; Persian is in
          Whisper's 99-language set per
          docs/research/TECH_CURRENCY_2026-09.md's STT section) directly on
          the prod server -- removes the OpenRouter network hop and per-call cost,
          likely *lower* latency, but needs a deploy step (CPU/GPU sizing,
          model download, a code path change) the owner must approve; not
          done here.
      - id: openai/gpt-audio
        price_per_1m: { in: 2.50, out: 10.00 }
        note: >
          Not yet wired into any code path (a documented fallback candidate
          only, per issue #39 task 2). Real, live-listed OpenRouter id
          (audio input modality, chat completions) in the same model family
          as `gpt-4o-transcribe`, which
          docs/research/TECH_CURRENCY_2026-09.md's STT section cites Persian
          as included in its 99+ language set. Price shown is the
          chat-completion prompt/completion price that
          scripts/check_models.py verifies; OpenRouter bills raw audio input
          separately (~$32/1M audio tokens at this audit) and there is no
          streaming/low-latency transcription mode for it the way there was
          for the dedicated Whisper endpoint -- a real latency regression risk
          if it is ever promoted to primary. output_apps/ecosystem_core/src/
          factory/stt_engine.py's own internal fallback currently hardcodes
          `google/gemini-2.0-flash-001` for this same purpose, which this
          2026-09-26 audit also found retired from the live catalogue; that
          is a second, pre-existing degradation this PR flags but does not
          fix, to keep this change small.

  tts:
    description: Text-to-speech for the voice pipeline (Persian/Farsi required).
    data_policy: standard
    models:
      - id: edge-tts:fa-IR-FaridNeural
        price_per_1m: { in: 0, out: 0 }
        note: >
          Not an OpenRouter model — Microsoft Edge neural TTS, free, called
          directly (not through llm_router.py). Documented Persian voice per
          docs/research/TECH_CURRENCY_2026-09.md. scripts/check_models.py
          skips this id (it will never appear in GET /api/v1/models).

  vision:
    description: >
      Persian OCR of scanned/photographed case files (case_files.py). Receives
      customer case data, so only paid models (never :free); requests also send
      provider.data_collection=deny. Gemini Pro is banned by owner policy.
    data_policy: standard
    models:
      # Same id the legacy documents/document_processor.py vision tier already
      # defaulted to (VISION_OCR_MODEL), now registered here.
      - id: google/gemini-3.8-flash
        price_per_1m: { in: 0.75, out: 3.75 }

  voice_realtime:
    description: >
      W20 (docs/W20_realtime_voice.md): optional native speech-to-speech
      provider for the live-voice websocket, behind VOICE_REALTIME_PROVIDER
      (default off — the STT→LLM→TTS cascade above stays the default path).
      Not an OpenRouter model — called directly against Google's Gemini Live
      API with GEMINI_API_KEY (server env only, never sent to the browser).
      scripts/check_models.py skips these ids (Gemini Live models are not in
      OpenRouter's GET /api/v1/models catalogue); ids were instead confirmed
      live 2026-09-26 via a read-only `client.models.list()` call from
      the prod server against the real GEMINI_API_KEY now in that server's .env.
    data_policy: standard
    models:
      - id: gemini-3.8-live
        price_per_1m: null
        catalogue_listed: false
        note: >
          Primary: newest full-quality native-audio live model (not the
          `-extended-thinking` variant, which adds reasoning latency this
          live-voice path doesn't need — legal grounding is injected as RAG
          context per turn instead, see gemini_live_bridge.py). Confirmed
          live 2026-09-26. Google's per-token audio price
          (ai.google.dev/gemini-api/docs/pricing, fetched 2026-09-26):
          input $3/1M audio tokens (~$0.005/min), output $12/1M audio tokens
          (~$0.018/min) — no flat per-1M text-equivalent price, hence `null`
          here; docs/W20_realtime_voice.md has the per-minute estimate.
      - id: gemini-3.1-flash-live-preview
        price_per_1m: null
        catalogue_listed: false
        note: >
          Fallback / cost-reduction option: same live-audio family, smaller
          and cheaper. Confirmed live 2026-09-26. Preview status — do not
          promote to primary without an explicit stability check.

  # ---- Builder roles (agents that write/review code, W10/W12) -------------
  architect:
    description: >
      Deep system reasoning, schema design, plan review. Driven through the
      Claude Code subscription, not billed per-token via this registry — the
      price below is the OpenRouter reference price only, for cost-comparison
      tooling, and is never charged in practice for this role.
      docs/STRATEGY.md §3a.
    data_policy: standard
    billed_via_api: false
    models:
      - id: anthropic/claude-opus-5
        price_per_1m: { in: 5.00, out: 25.00 }

  executor:
    description: >
      Cheap coding model driving OpenCode's `build` agent on GitHub Actions
      runners (W10 phase 2, .github/workflows/agent-task.yml). Cheapest
      coding-capable id live on 2026-09-25, already used in
      src/automation/self_healing_agent.py. Price re-checked LIVE 2026-09-29
      (issue #103): deepseek-v4-flash-0731 0.018/0.32 (was 0.021/0.32) and
      deepseek-v4-flash 0.0763/0.1526 (was 0.049/0.098); v4.1-flash unchanged
      at 0.30/1.20.
    data_policy: standard
    # 2026-09-26 hub: model-eval.yml run 36235122337 -- v4.1-flash 7/7, 5.2s avg,
    # $0.0066; v4-flash-0731 3/7 (4 calls hit the 120s deadline), 39s avg, $0.0022.
    models:
      - id: deepseek/deepseek-v4.1-flash
        price_per_1m: { in: 0.036, out: 0.405, cache_read: 0.0054 }
      - id: deepseek/deepseek-v4-flash-0731
        price_per_1m: { in: 0.018, out: 0.32 }
      - id: deepseek/deepseek-v4-flash
        price_per_1m: { in: 0.0763, out: 0.1526 }
    # Not active models, not read by role_models()/role_entries() (they only read
    # `models:` above). Noted here so the next model-eval run has a shortlist instead
    # of starting from scratch. Promote to `models:` only after scripts/check_models.py
    # shows the id live and it passes the eval bar described in role_entries' comment
    # above (coding smoke task + no regression).
    candidates:
      - id: z-ai/glm-5.3
        note: pending model-eval runs
      - id: moonshotai/kimi-k3
        note: pending model-eval runs

  reviewer:
    description: >
      Reviews the executor's diff before CI/PR. The list must contain at least
      one model from a different family than the `executor` primary (DeepSeek),
      so a single vendor's blind spot or outage does not silently pass its own
      bad output. Enforced by scripts/dev/check_reviewer_family.py.
    data_policy: standard
    # Owner policy (2026-10-10), model priority for builder reviews:
    #   1) `:free` models, ONLY for non-sensitive input (public-repo code, docs),
    #      never customer/case data;
    #   2) deepseek/deepseek-v4.1-flash;
    #   3) other cheap models.
    # Gemini Pro is forbidden everywhere; Gemini Flash only when essential.
    # anthropic/claude-sonnet-5 and google/gemini-3.8-flash were removed from
    # this role by the same owner decision (cost).
    #
    # Family tradeoff: the executor is DeepSeek, so the different-family entry
    # today is the free qwen model. If that model fails, the list falls through
    # to deepseek/deepseek-v4.1-flash (same family as the executor) BEFORE the
    # non-DeepSeek qwen/qwen3-coder, because the owner's priority order puts
    # DeepSeek second. So a same-family review happens whenever the free model is
    # unavailable. Accepted tradeoff; revisit if it causes a bad auto-merge.
    #
    # `public_code_only: true` marks an entry that may only receive public-repo
    # code/docs, never customer/case data. Enforced by the guard test in
    # src/test_model_registry.py, not by the runtime.
    models:
      - id: qwen/qwen3.8-27b:free
        price_per_1m: { in: 0, out: 0 }
        public_code_only: true
      - id: deepseek/deepseek-v4.1-flash
        price_per_1m: { in: 0.036, out: 0.405, cache_read: 0.0054 }
      - id: qwen/qwen3-coder
        price_per_1m: { in: 0.30, out: 1.00 }

  mechanical:
    description: >
      Mechanical edits, renames, formatting, triage/format-checking
      (docs/STRATEGY.md §3a "Haiku" row; AGENTS.md §3 "Triage/Format Checker").
      google/gemini-3.5-flash-lite (the id previously hardcoded in AGENTS.md)
      was NOT found live in the 2026-09-25 audit; google/gemini-3.1-flash-lite
      is the live sibling id and is used here instead.
    data_policy: standard
    models:
      - id: google/gemini-3.1-flash-lite
        price_per_1m: { in: 0.25, out: 1.50 }
      - id: anthropic/claude-haiku-4.5
        price_per_1m: { in: 1.00, out: 5.00 }

  # ---- Server-side agent runner (scripts/infra/server_agents, docs/ops/SERVER_AGENTS.md) ----
  # Read by setup.sh (renders /etc/roxira/opencode-agents.json) and run_task.sh (alias -> model).
  # `alias` is the name given to run_task.sh --model; `provider` is the OpenCode provider id.
  # Groq ids are NOT in OpenRouter's catalogue (catalogue_listed: false); setup.sh checks them against
  # Groq's own GET /openai/v1/models when GROQ_API_KEY is present. Cost policy: Groq free tier first,
  # DeepSeek Flash second, :free only for public code (agent_runner_public).
  agent_runner:
    description: >
      Routine coding tasks run on the production server by OpenCode with a cheap or free-tier
      model instead of Claude tokens. Order = cost policy.
    data_policy: standard
    models:
      - id: openai/gpt-oss-120b
        alias: groq-strong
        provider: groq
        price_per_1m: { in: 0.15, out: 0.60 }
        catalogue_listed: false
      - id: openai/gpt-oss-20b
        alias: groq-fast
        provider: groq
        price_per_1m: null
        catalogue_listed: false
        note: Groq production model; price not re-verified here. Free tier has daily token limits.
      - id: deepseek/deepseek-v4.1-flash
        alias: ds-flash
        provider: openrouter
        price_per_1m: { in: 0.036, out: 0.405, cache_read: 0.0054 }

  agent_runner_public:
    description: >
      Same runner, free OpenRouter model. PUBLIC CODE ONLY: providers may log or train on prompts.
      run_task.sh refuses it unless --public is given.
    data_policy: non_sensitive_only
    models:
      - id: qwen/qwen3.8-27b:free
        alias: free-public
        provider: openrouter
        price_per_1m: { in: 0, out: 0 }
        public_code_only: true
